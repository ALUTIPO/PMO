<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALUTIPO PMO — Colaborativo en Tiempo Real</title>
<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<!-- SheetJS: genera el .xlsx real de exportación de Bodega para Bsale -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<!-- Fuentes -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #10151c;
  --ink-2: #1a222e;
  --ink-3: #28323f;
  --paper: #eef1f4;
  --paper-2: #e2e7ec;
  --card: #ffffff;
  --line: #d7dce2;
  --line-soft: #e7eaee;
  --copper: #c1712e;
  --copper-dark: #9c5a22;
  --copper-light: #f0dcc5;
  --blueprint: #2f6f8f;
  --blueprint-light: #dcedf3;
  --ok: #2f7d5c;
  --ok-bg: #e2f2ea;
  --warn: #c98a2b;
  --warn-bg: #faedd6;
  --danger: #b3452c;
  --danger-bg: #f9e2db;
  --muted: #6b7480;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(16,21,28,.06), 0 6px 20px -8px rgba(16,21,28,.12);
  font-size: 15px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
code, .mono, .mono * { font-family: 'IBM Plex Mono', monospace; }
h1,h2,h3,h4 { font-family: 'IBM Plex Sans', sans-serif; margin: 0; letter-spacing: -0.01em; }
p { margin: 0; }
button { font-family: inherit; }
a { color: var(--blueprint); }
#app { display: flex; height: 100vh; }
/* Sidebar */
.sidebar {
  width: 230px; flex-shrink: 0;
  background: linear-gradient(180deg, var(--ink) 0%, var(--ink-2) 100%);
  color: #cfd6de;
  display: flex; flex-direction: column;
  position: relative;
  height: 100vh; overflow-y: auto;
}
.sidebar::before {
  content: "";
  position: absolute; inset: 0;
  background-image:
    linear-gradient(var(--ink-3) 1px, transparent 1px),
    linear-gradient(90deg, var(--ink-3) 1px, transparent 1px);
  background-size: 26px 26px;
  opacity: .18;
  pointer-events: none;
}
.brand {
  padding: 22px 20px 18px 20px;
  position: relative; z-index: 1;
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.brand .mark { display: flex; align-items: center; gap: 10px; }
.brand .bolt { width: 30px; height: 30px; flex-shrink: 0; }
.brand-logo-plate {
  background: #fff; border-radius: 10px; padding: 10px 14px;
  display: inline-flex; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.15);
}
.brand-logo-img { display: block; height: 26px; width: auto; }
.brand-name { font-weight: 700; font-size: 16.5px; color: #fff; letter-spacing: .01em; }
.brand-sub { font-size: 11px; color: var(--copper-light); margin-top: 2px; font-family: 'IBM Plex Mono', monospace; letter-spacing: .04em; text-transform: uppercase; }
.nav { padding: 14px 12px; position: relative; z-index: 1; flex: 1; }
.nav-group-label {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: #7c8794;
  padding: 14px 10px 6px 10px;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%; text-align: left;
  padding: 9px 10px; margin-bottom: 2px;
  border: none; background: transparent; color: #c3cbd4;
  border-radius: 8px; cursor: pointer; font-size: 13.5px;
  transition: background .12s ease, color .12s ease;
}
.nav-item svg { width: 16px; height: 16px; opacity: .85; flex-shrink: 0; }
.nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav-item.active { background: var(--copper); color: #fff; font-weight: 600; }
.nav-item.active svg { opacity: 1; }
.req-nav-badge {
  margin-left: auto; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700;
  min-width: 17px; height: 17px; border-radius: 20px; display: none; align-items: center; justify-content: center; padding: 0 4px;
}
.sidebar-foot {
  padding: 14px 18px 18px 18px; position: relative; z-index: 1;
  border-top: 1px solid rgba(255,255,255,.08);
  font-size: 11px; color: #7c8794; line-height: 1.5;
}
.sidebar-foot b { color: #b9c1ca; }
/* Main */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
.topbar {
  background: var(--card); border-bottom: 1px solid var(--line);
  padding: 12px 26px; display: flex; align-items: center; justify-content: space-between;
  gap: 16px; position: sticky; top: 0; z-index: 20;
}
.topbar-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
.topbar-title { font-size: 17px; font-weight: 600; }
.topbar-crumb { font-size: 12px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.role-picker { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.role-picker select {
  font-family: inherit; font-size: 12.5px; padding: 6px 9px; border-radius: 7px;
  border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer;
}
.env-chip {
  font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: .05em;
  padding: 4px 9px; border-radius: 20px; background: var(--warn-bg); color: var(--copper-dark);
  border: 1px solid #eccf9c;
}
.content { padding: 22px 26px 60px 26px; flex: 1; overflow-y: auto; }
.page { display: none; }
.page.active { display: block; animation: fadein .18s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 10px; }
.page-head h1 { font-size: 21px; }
.page-desc { color: var(--muted); font-size: 13px; margin-top: 4px; max-width: 640px; }
.grid { display: grid; gap: 14px; }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
@media (max-width: 1100px) { .grid-4 { grid-template-columns: repeat(2, 1fr); } .grid-3 { grid-template-columns: repeat(2, 1fr); } }
.card {
  background: var(--card); border: 1px solid var(--line-soft); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 18px;
}
.card h3 { font-size: 14.5px; margin-bottom: 2px; }
.card-flush { padding: 0; }
.kpi { padding: 16px 18px; }
.kpi-label { font-size: 12px; color: var(--muted); display: flex; align-items: center; justify-content: space-between; }
.kpi-value { font-size: 30px; font-weight: 700; margin-top: 8px; font-family: 'IBM Plex Mono', monospace; letter-spacing: -0.01em; }
.kpi-sub { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px;
  white-space: nowrap; line-height: 1.6;
}
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.b-verde,.b-completado,.b-recibido,.b-aprobada,.b-verificado { background: var(--ok-bg); color: var(--ok); }
.b-verde .dot,.b-completado .dot,.b-recibido .dot,.b-aprobada .dot,.b-verificado .dot { background: var(--ok); }
.b-amarillo,.b-progreso,.b-transito,.b-pendiente-rev { background: var(--warn-bg); color: var(--copper-dark); }
.b-amarillo .dot,.b-progreso .dot,.b-transito .dot,.b-pendiente-rev .dot { background: var(--copper); }
.b-rojo,.b-bloqueado,.b-rechazada,.b-critico { background: var(--danger-bg); color: var(--danger); }
.b-rojo .dot,.b-bloqueado .dot,.b-rechazada .dot,.b-critico .dot { background: var(--danger); }
.b-gris,.b-pendiente,.b-cotizando,.b-noiniciado { background: #eceff2; color: var(--muted); }
.b-gris .dot,.b-pendiente .dot,.b-cotizando .dot,.b-noiniciado .dot { background: var(--muted); }
.b-blue,.b-lista { background: var(--blueprint-light); color: var(--blueprint); }
.b-blue .dot,.b-lista .dot { background: var(--blueprint); }
.btn {
  font-family: inherit; font-size: 12.5px; font-weight: 600; border-radius: 8px; cursor: pointer;
  padding: 8px 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  transition: .12s ease; display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { border-color: var(--ink-3); background: var(--paper); }
.btn-primary { background: var(--copper); border-color: var(--copper); color: #fff; }
.btn-primary:hover { background: var(--copper-dark); border-color: var(--copper-dark); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--blueprint); }
.btn-ghost:hover { background: var(--blueprint-light); border-color: transparent; }
.btn-sm { padding: 5px 10px; font-size: 11.5px; border-radius: 6px; }
.btn-danger { color: var(--danger); border-color: #e4b8ac; }
.btn-danger:hover { background: var(--danger-bg); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
  padding: 9px 12px; border-bottom: 1px solid var(--line); background: var(--paper); font-weight: 600;
}
td { padding: 10px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
.table-wrap { border: 1px solid var(--line-soft); border-radius: var(--radius); overflow: hidden; }
.row-click { cursor: pointer; }
.row-click:hover { background: var(--paper); }
.progressbar { height: 8px; border-radius: 20px; background: var(--paper-2); overflow: hidden; position: relative; }
.progressbar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--copper), #d68a44); border-radius: 20px; transition: width .3s ease; }
.progressbar.thin { height: 5px; }
.toast-wrap { position: fixed; bottom: 20px; right: 20px; z-index: 999; display: flex; flex-direction: column; gap: 8px; max-width: 360px; }
.toast {
  background: var(--ink); color: #fff; padding: 12px 15px; border-radius: 9px; font-size: 12.5px;
  box-shadow: 0 10px 30px -8px rgba(0,0,0,.4); display: flex; gap: 10px; align-items: flex-start;
  animation: slidein .2s ease;
}
.toast.warn { background: var(--copper-dark); }
.toast.danger { background: var(--danger); }
.toast.ok { background: var(--ok); }
@keyframes slidein { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }
.modal-overlay { position: fixed; inset: 0; background: rgba(16,21,28,.5); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
.modal { background: #fff; border-radius: 12px; width: 100%; max-width: 480px; max-height: 88vh; box-shadow: 0 30px 60px -20px rgba(0,0,0,.4); display: flex; flex-direction: column; overflow: hidden; }
.modal-head { padding: 16px 20px; border-bottom: 1px solid var(--line-soft); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
.modal-head h3 { font-size: 15px; }
.modal-body { padding: 18px 20px; font-size: 13.5px; overflow-y: auto; flex: 1 1 auto; min-height: 0; }
.modal-foot { padding: 14px 20px; border-top: 1px solid var(--line-soft); display: flex; justify-content: flex-end; gap: 8px; flex-shrink: 0; background: #fff; }
.modal textarea, .modal select, .modal input[type=text] {
  width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 7px; font-family: inherit; font-size: 13px; margin-top: 6px;
}
.field-label { font-size: 12px; font-weight: 600; color: var(--ink-3); margin-top: 12px; display: block; }
.field-label:first-child { margin-top: 0; }
.hint { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.close-x { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--muted); line-height: 1; }
.tag-role { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; padding: 2px 7px; border-radius: 5px; background: var(--blueprint-light); color: var(--blueprint); display: inline-block; }
.divider { height: 1px; background: var(--line-soft); margin: 16px 0; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.flex { display: flex; }
.flex-between { display: flex; align-items: center; justify-content: space-between; }
.flex-gap { display: flex; align-items: center; gap: 8px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
.ai-note { background: var(--blueprint-light); border: 1px solid #c3dde8; border-radius: 9px; padding: 10px 13px; font-size: 12px; color: #265a72; display: flex; gap: 8px; align-items: flex-start; }
.section-label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin: 22px 0 10px 0; }
.section-label:first-child { margin-top: 0; }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: #c7ccd2; border-radius: 20px; }

/* ===================== REQUERIMIENTOS (chat + solicitudes) ===================== */
.ctx-switch{ display:flex; align-items:center; gap:6px; }
.ctx-chip{ font-size:11.5px; font-weight:600; padding:6px 11px; border-radius:20px; border:1px solid var(--line); background:var(--card); cursor:pointer; }
.ctx-chip.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
.alert-chip{ display:inline-flex; align-items:center; gap:7px; background:var(--danger-bg); color:var(--danger); border:1px solid #e7bfae; padding:6px 12px; border-radius:20px; font-size:12px; font-weight:700; cursor:pointer; }
.alert-chip.zero{ background:var(--ok-bg); color:var(--ok); border-color:#bfe0cf; cursor:default; }

.req-body{ display:flex; min-height:520px; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; background:var(--paper); }
.chat-col{ flex:1; min-width:0; display:flex; flex-direction:column; background:var(--paper); }
.chat-head{ background:var(--card); border-bottom:1px solid var(--line-soft); padding:10px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
.chat-head .room-sub{ font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:6px; margin-top:1px; }
.online-dot{ width:7px; height:7px; border-radius:50%; background:var(--ok); display:inline-block; }
.req-toggle-btn{ position:relative; }
.req-toggle-badge{ position:absolute; top:-5px; right:-5px; background:var(--danger); color:#fff; font-size:9.5px; font-weight:700; min-width:15px; height:15px; border-radius:20px; display:flex; align-items:center; justify-content:center; }
.messages{ flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:4px; max-height:calc(100vh - 340px); }
.msg-row{ display:flex; gap:9px; max-width:76%; margin-bottom:6px; }
.msg-row.own{ align-self:flex-end; flex-direction:row-reverse; }
.avatar{ width:29px; height:29px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; color:#fff; background:var(--ink-3); }
.msg-body{ min-width:0; }
.msg-meta{ font-size:11px; color:var(--muted); margin-bottom:3px; display:flex; gap:6px; align-items:center; }
.msg-row.own .msg-meta{ justify-content:flex-end; }
.bubble{ background:var(--card); border:1px solid var(--line-soft); border-radius:14px 14px 14px 4px; padding:9px 13px; font-size:13.5px; line-height:1.45; }
.msg-row.own .bubble{ background:var(--copper-light); border-color:#e2c39c; border-radius:14px 14px 4px 14px; }
.bubble.req{ border-radius:12px; border-width:1.5px; border-left-width:4px; }
.bubble .req-head{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
.bubble .req-foot{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); font-size:11px; color:var(--muted); }
.link-chip{ font-family:'IBM Plex Mono',monospace; font-size:10px; background:var(--paper-2); padding:2px 7px; border-radius:5px; color:var(--ink-3); display:inline-block; }
.msg-time{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; }
.pin-action{ opacity:0; transition:opacity .12s ease; background:none; border:none; cursor:pointer; font-size:14px; color:var(--muted); align-self:flex-end; padding:4px; }
.msg-row:hover .pin-action{ opacity:1; }
@media (hover:none){ .pin-action{ opacity:.55; } }
.composer{ background:var(--card); border-top:1px solid var(--line-soft); padding:10px 14px; display:flex; align-items:flex-end; gap:10px; }
.composer textarea{ flex:1; resize:none; border:1px solid var(--line); border-radius:20px; padding:9px 15px; font-family:inherit; font-size:13.5px; max-height:100px; min-height:38px; }
.composer textarea:focus{ outline:none; border-color:var(--copper); }
.send-btn{ width:38px; height:38px; border-radius:50%; background:var(--copper); border:none; color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.send-btn:hover{ background:var(--copper-dark); }

.req-panel{ width:330px; flex-shrink:0; background:var(--card); border-left:1px solid var(--line-soft); overflow-y:auto; display:flex; flex-direction:column; }
.req-panel-head{ padding:12px 16px 10px; border-bottom:1px solid var(--line-soft); display:flex; justify-content:space-between; align-items:center; }
.req-filters{ display:flex; gap:6px; padding:9px 12px; flex-wrap:wrap; border-bottom:1px solid var(--line-soft); }
.req-list{ padding:10px; display:flex; flex-direction:column; gap:9px; }
.req-card{ border:1px solid var(--line-soft); border-radius:10px; padding:10px 11px; }
.req-card .txt{ font-size:12.5px; margin:6px 0 7px; line-height:1.4; cursor:pointer; }
.req-card .row{ display:flex; align-items:center; justify-content:space-between; gap:6px; flex-wrap:wrap; }
.req-card .who{ font-size:11px; color:var(--muted); margin-top:6px; }
.req-card .actions{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
.btn-whatsapp{ background:#25D366; border-color:#25D366; color:#fff; }
.btn-whatsapp:hover{ background:#1ea952; border-color:#1ea952; }

.tipo-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
.tipo-chip{ border:1.5px solid var(--line); border-radius:9px; padding:10px; text-align:center; cursor:pointer; font-size:12px; font-weight:600; }
.tipo-chip:hover{ border-color:var(--copper); }
.tipo-chip.selected{ border-color:var(--copper); background:var(--copper-light); }
.opt-btn{ display:block; width:100%; text-align:left; padding:12px 14px; border:1.5px solid var(--line); border-radius:9px; background:#fff; cursor:pointer; font-family:inherit; font-size:13px; margin-top:8px; }
.opt-btn:hover{ border-color:var(--copper); background:var(--copper-light); }
.opt-btn.selected{ border-color:var(--copper); background:var(--copper-light); font-weight:600; }
.opt-btn small{ display:block; color:var(--muted); font-weight:400; margin-top:2px; font-size:11.5px; }
.step-dots{ display:flex; gap:5px; }
.step-dots span{ width:7px; height:7px; border-radius:50%; background:var(--line); }
.step-dots span.active{ background:var(--copper); }
.urgencia-preview{ margin-top:16px; padding:12px 14px; border-radius:9px; display:flex; align-items:center; gap:10px; }
.suggest-note{ font-size:11px; color:var(--blueprint); background:var(--blueprint-light); padding:6px 10px; border-radius:7px; margin-top:8px; }

@media (max-width:900px){
  .req-body{ position:relative; min-height:0; height:calc(100vh - 260px); }
  .req-panel{ display:none; }
  .req-panel.mobile-open{ display:flex; position:fixed; inset:0; z-index:55; width:100%; height:100vh; }
  .msg-row{ max-width:88%; }
  .messages{ max-height:none; }
}

/* ===================== RESPONSIVE / MÓVIL ===================== */
.hamburger-btn {
  display: none; background: none; border: none; cursor: pointer;
  padding: 6px; color: var(--ink); flex-shrink: 0; border-radius: 7px;
}
.hamburger-btn:hover { background: var(--paper); }
.hamburger-btn svg { width: 22px; height: 22px; display: block; }
.sidebar-overlay {
  display: none; position: fixed; inset: 0; background: rgba(16,21,28,.45); z-index: 39;
}
.sidebar-overlay.show { display: block; }
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { min-width: 560px; }

@media (max-width: 860px) {
  .hamburger-btn { display: inline-flex; align-items: center; justify-content: center; }
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; z-index: 40;
    width: 250px; max-width: 82vw;
    transform: translateX(-100%);

function avanceHasta(hasta, extra) {
  const o = {};
  for(let i=1; i<=hasta; i++) o[i] = {estado:"Completado", avance:100, fechaCompletado:"2026-0"+(3+Math.floor(i/6))+"-1"+(i%9)};
  if(extra) Object.assign(o, extra);
  return o;
}

function migrarProyecto(p) {
  if(!p.planificacion) p.planificacion = [];
  if(!p.iaRiesgos) p.iaRiesgos = [];
  if(!p.reportesGerenciales) p.reportesGerenciales = [];
  if(!p.reaperturas) p.reaperturas = [];
  if(!p.punch) p.punch = [];
  if(p.modoCierre===undefined) p.modoCierre = false;
  p.punch.forEach(it => {
    if (!Array.isArray(it.subitems)) it.subitems = [];
    // Se reemplazó "fecha objetivo" (una sola fecha) por un rango real
    // inicio/término, que es lo que puede alimentar la carta Gantt.
    if (it.fechaInicio===undefined) it.fechaInicio = "";
    if (it.fechaTermino===undefined) it.fechaTermino = it.fechaObjetivo || "";
    delete it.fechaObjetivo;
    // Migración en dos pasos, sin perder información previa:
    // 1) modelo viejísimo (hecho: true/false) -> estado de 3 valores
    // 2) modelo intermedio (estado de 3 valores) -> % numérico (0-100),
    //    que es lo que usa el control deslizante actual.
    it.subitems.forEach(sub => {
      if (sub.estado===undefined && sub.avance===undefined) {
        sub.estado = sub.hecho ? "Completado" : "No Iniciado";
        sub.actualizadoPor = sub.hechoPor||""; sub.actualizadoFecha = sub.hechoFecha||"";
        delete sub.hecho; delete sub.hechoPor; delete sub.hechoFecha;
      }
      if (sub.avance===undefined) {
        sub.avance = sub.estado==="Completado" ? 100 : (sub.estado==="En Progreso" ? 50 : 0);
        delete sub.estado;
      }
      // "Asignado a" pasa de texto libre a un enlace real con la dotación
      // (DB.personal) — se intenta calzar por nombre; si no calza con
      // nadie, se conserva el texto original en asignadoNota para no
      // perder la información, y queda sin enlazar.
      if (sub.asignadoPersonaId===undefined) {
        const match = sub.asignadoA ? DB.personal.find(per => per.nombre.trim().toLowerCase()===sub.asignadoA.trim().toLowerCase()) : null;
        sub.asignadoPersonaId = match ? match.id : "";
        sub.asignadoNota = (sub.asignadoA && !match) ? sub.asignadoA : "";
        delete sub.asignadoA;
      }
    });
    if (it.asignadoPersonaId===undefined) it.asignadoPersonaId = "";
    sincronizarPunchAGanttObj(p, it);
  });
  if(!p.bodega) p.bodega = [];
  if(!p.compras) p.compras = [];
  // Módulo de Compras rediseñado: de "un ítem plano por compra" a
  // "cotización con varios ítems". Si el proyecto viene con el modelo
  // viejo (p.compras) y todavía no tiene p.cotizaciones, se migra cada
  // compra antigua a una cotización de un solo ítem, sin perder datos.
  if(!Array.isArray(p.cotizaciones) || !p.cotizaciones.length) {
    p.cotizaciones = (p.compras||[]).map(c => ({
      id: c.id || ("COT-"+Math.random().toString(36).slice(2,7)),
      numeroCotizacion: c.numeroCotizacion || "",
      proveedor: c.proveedor || "",
      fecha: c.fecha || c.fechaEstim || hoyISO(),
      referencia: c.referencia || c.item || "",
      importancia: c.importancia || "Media",
      linkSharepoint: c.linkSharepoint || "",
      estado: c.estado || "Cotizando",
      longLead: !!c.longLead,
      fechaEstim: c.fechaEstim || "",
      alerta: c.alerta || "",
      items: (Array.isArray(c.items) && c.items.length) ? c.items : [
        {id:1, descripcion:c.item||"Ítem sin descripción", cantidad:c.cantidad||1, unidad:c.unidad||"unidad", montoNeto:c.monto||0}
      ],
      numeroOC: c.numeroOC || "",
      linkOC: c.linkOC || "",
      recepciones: Array.isArray(c.recepciones) ? c.recepciones : [],
    }));
  }
  // Firebase Realtime Database no persiste arrays vacíos ([]) — al releer
  // vuelven como undefined. Cualquier array que pueda quedar vacío en
  // algún momento (depende, predecesores, items, recepciones) debe
  // normalizarse acá siempre que se carga el proyecto, o cualquier
  // función que haga .length/.map sobre ese campo revienta en silencio.
  if(Array.isArray(p.postas)) p.postas.forEach(t => {
    if(!Array.isArray(t.depende)) t.depende = [];
    if(t.comentario===undefined) t.comentario = "";
    if(t.comentarioPor===undefined) t.comentarioPor = "";
    if(t.comentarioFecha===undefined) t.comentarioFecha = "";
    if(t.linkSharepoint===undefined) t.linkSharepoint = "";
  });
  if(Array.isArray(p.planificacion)) p.planificacion.forEach(t => {
    if(!Array.isArray(t.predecesores)) t.predecesores = [];
  });
  if(Array.isArray(p.cotizaciones)) p.cotizaciones.forEach(c => {
    if(!Array.isArray(c.items) || !c.items.length) c.items = [{id:1, descripcion:c.referencia||"Ítem sin descripción", cantidad:1, unidad:"unidad", montoNeto:0, cantidadRecibida:0}];
    c.items.forEach(it => { if(it.cantidadRecibida===undefined) it.cantidadRecibida = (c.estado==="Recibido") ? (Number(it.cantidad)||0) : 0; });
    if(!Array.isArray(c.recepciones)) c.recepciones = [];
    c.recepciones.forEach(r => { if(!Array.isArray(r.items)) r.items = []; });
    if(c.numeroOC===undefined) c.numeroOC = "";
    if(c.linkOC===undefined) c.linkOC = "";
  });
  return p;
}

function totalNetoCotizacion(c) {
  // "monto neto" ingresado por línea YA es el total de esa línea (sin IVA),
  // no un precio unitario — así lo pidió el usuario. No se multiplica por cantidad.
  return (c.items||[]).reduce((s,it)=> s + (Number(it.montoNeto)||0), 0);
}

function avanceGlobal(p) {
  let num=0, den=0;
  p.postas.forEach(t => { num += (t.avance/100)*t.dias; den += t.dias; });
  return den ? Math.round((num/den)*1000)/10 : 0;
}

function semaforo(p) {
  const bloqueadas = p.postas.filter(t => t.estado === "Bloqueado");
  if(bloqueadas.length === 0) return "Verde";
  const critico = bloqueadas.some(t => t.hito || diasBloqueado(t) > 5);
  if(critico) return "Rojo";
  return "Amarillo";
}

function diasBloqueado(t) {
  if(!t.fechaBloqueo) return 0;
  const hoy = new Date();
  const d = new Date(t.fechaBloqueo);
  return Math.max(0, Math.round((hoy-d)/86400000));
}

function presupuesto(p) {
  const total = p.presupuestoTotal;
  const real60 = total*0.6, emer40 = total*0.4;
  let comprometido=0, ejecutado=0;
  (p.cotizaciones||[]).forEach(c => {
    const montoNeto = totalNetoCotizacion(c);
    if(c.estado==="OC Solicitada" || c.estado==="OC Emitida" || c.estado==="En Tránsito" || c.estado==="Recibido Parcial") comprometido += montoNeto;
    if(c.estado==="Recibido") ejecutado += montoNeto;
  });
  const emerUsada = (p.emergenciaUsada||0);
  const realUsado = comprometido+ejecutado;
  return {
    total, real60, emer40,
    comprometido, ejecutado, realUsado,
    realDisponiblePct: real60 ? Math.max(0,Math.round(100-(realUsado/real60*100))) : 0,
    emerUsada, emerDisponiblePct: emer40 ? Math.max(0,Math.round(100-(emerUsada/emer40*100))) : 100,
  };
}

const DB = {
  role: null,
  proyectoActivo: "P1",
  historial: [],
  proyectos: [],
  proveedores: [],
  bodegaGeneral: [],
  usuariosAutorizados: {},
  personal: [],
  asignaciones: [],
  usuario: "Usuario",
  updatedAt: null,
  syncStatus: "cargando",
  mensajes: {}, // caché local del nodo /mensajes — no viaja por stateRef, ver configurarMensajes()
  bitacoraPunch: {}, // caché local de /bitacoraPunch — igual criterio, ver configurarBitacoraPunch()
};
let modalAbierto = false;
let _guardando = false;
let _guardarPendiente = false;

function aplicarEstadoRemoto(data) {
  DB.historial = data.historial || [];
  DB.proveedores = data.proveedores && data.proveedores.length ? data.proveedores : (DB.proveedores.length ? DB.proveedores : cloneProveedoresSeed());
  DB.personal = data.personal && data.personal.length ? data.personal : (DB.personal.length ? DB.personal : clonePersonalSeed());
  DB.personal.forEach(per => { if (per.telefono===undefined) per.telefono = ""; });
  DB.asignaciones = data.asignaciones || [];
  DB.bodegaGeneral = data.bodegaGeneral || [];
  DB.updatedAt = data.updatedAt || null;
  // proyectos al final: su migración puede necesitar cruzar nombres contra
  // DB.personal (ya cargado arriba) para enlazar asignaciones antiguas.
  DB.proyectos = (data.proyectos || []).map(migrarProyecto);
}

async function guardarEstado(nota) {
  if (_guardando) { _guardarPendiente = true; return; }
  _guardando = true;
  DB.syncStatus = "guardando";
  actualizarIndicadorSync();

  if (DB.historial.length > 300) DB.historial = DB.historial.slice(0, 300);

  const payload = {
    proyectos: DB.proyectos,
    historial: DB.historial,
    proveedores: DB.proveedores,
    personal: DB.personal,
    asignaciones: DB.asignaciones,
    bodegaGeneral: DB.bodegaGeneral,
    updatedAt: new Date().toISOString(),
  };

  try {
    await stateRef.set(payload);
    DB.updatedAt = payload.updatedAt;
    DB.syncStatus = "ok";
    toast(nota ? `Guardado: ${nota}` : "Cambios guardados en la nube.", "ok");
  } catch (e) {
    DB.syncStatus = "error";
    toast(`Error al guardar: ${e.message}`, "danger");
  }

  actualizarIndicadorSync();
  _guardando = false;
  if (_guardarPendiente) {
    _guardarPendiente = false;
    guardarEstado();
  }
}

async function cargarEstadoInicial() {
  DB.syncStatus = "cargando";
  actualizarIndicadorSync();

  try {
    const snapshot = await stateRef.once('value');
    const data = snapshot.val();
    if (data) {
      aplicarEstadoRemoto(data);
      DB.syncStatus = "ok";
    } else {
      DB.historial = [];
      DB.proveedores = cloneProveedoresSeed();
      DB.personal = clonePersonalSeed();
      DB.asignaciones = [];
      DB.bodegaGeneral = [];
      DB.proyectos = cloneSeed();
      await guardarEstado("Inicialización con datos de ejemplo");
    }
  } catch (e) {
    console.error("Firebase error:", e);
    DB.syncStatus = "error";
    DB.historial = [];
    DB.proveedores = cloneProveedoresSeed();
    DB.personal = clonePersonalSeed();
    DB.asignaciones = [];
    DB.proyectos = cloneSeed();
    toast("No se pudo conectar con Firebase. Usando datos locales.", "danger");
  }

  DB.proyectos.forEach(p => {
    p.avanceCache = avanceGlobal(p);
    p.semaforoCache = semaforo(p);
  });
  if (!DB.proyectos.find(p => p.id === DB.proyectoActivo)) {
    DB.proyectoActivo = DB.proyectos[0]?.id;
  }

  if (DB.syncStatus !== "error") {
    stateRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (data && data.updatedAt && data.updatedAt !== DB.updatedAt) {
        if (!modalAbierto) {
          aplicarEstadoRemoto(data);
          DB.proyectos.forEach(p => {
            p.avanceCache = avanceGlobal(p);
            p.semaforoCache = semaforo(p);
          });
          if (!DB.proyectos.find(p => p.id === DB.proyectoActivo)) {
            DB.proyectoActivo = DB.proyectos[0]?.id;
          }
          renderAll();
          toast("Se actualizó la información — un colaborador guardó cambios.", "ok");
        }
      }
    });
  }

  actualizarIndicadorSync();
  renderAll();
  configurarPresencia();
  configurarMensajes();
  configurarBitacoraPunch();
  toast(`Bienvenido, ${DB.usuario} (${DB.role}).`, "ok");
}

async function sincronizarDesdeServidor(silencioso) {
  try {
    const snapshot = await stateRef.once('value');
    const data = snapshot.val();
    if (data && data.updatedAt && data.updatedAt !== DB.updatedAt) {
      aplicarEstadoRemoto(data);
      DB.proyectos.forEach(p => {
        p.avanceCache = avanceGlobal(p);
        p.semaforoCache = semaforo(p);
      });
      if (!DB.proyectos.find(p => p.id === DB.proyectoActivo)) {
        DB.proyectoActivo = DB.proyectos[0]?.id;
      }
      renderAll();
      if (!silencioso) toast("Actualizado desde la nube.", "ok");
    }
  } catch(e) {
    DB.syncStatus = "error";
    actualizarIndicadorSync();
  }
}

function reintentarGuardado() {
  toast("Reintentando guardado…", "ok");
  guardarEstado();
}

// (con su rol ya asignado) antes de que la persona pueda crear su cuenta.
// El primer acceso crea la contraseña; después es solo iniciar sesión.
// El reseteo de contraseña es 100% autoservicio vía el correo oficial de
// Firebase — no requiere aprobación manual.
// ================================================================
function cargarUsuariosAutorizados() {
  return new Promise((resolve) => {
    usuariosAutorizadosRef.on('value', (snap) => {
      DB.usuariosAutorizados = snap.val() || {};
      resolve();
    });
  });
}

function esAdminUsuarios() {
  return DB.role === "Jefe de Proyecto" || DB.role === "Gerencia";
}

async function agregarUsuarioAutorizado(email, nombre, rol) {
  if (!esAdminUsuarios()) { toast(`Tu rol (${DB.role}) no puede gestionar usuarios.`, "danger"); return false; }
  email = (email||"").trim().toLowerCase();
  if (!email || !email.includes("@")) { toast("Correo inválido.", "danger"); return false; }
  if (!nombre || !nombre.trim()) { toast("Indica el nombre completo.", "danger"); return false; }
  const key = sanitizarEmailKey(email);
  try {
    await usuariosAutorizadosRef.child(key).set({ email, nombre: nombre.trim(), rol });
    toast(`${nombre} quedó autorizado con rol ${rol}. Ya puede crear su contraseña con ese correo.`, "ok");
    return true;
  } catch(e) {
    toast("No se pudo guardar: "+e.message, "danger");
    return false;
  }
}
async function eliminarUsuarioAutorizado(email) {
  if (!esAdminUsuarios()) { toast(`Tu rol (${DB.role}) no puede gestionar usuarios.`, "danger"); return; }
  try {
    await usuariosAutorizadosRef.child(sanitizarEmailKey(email)).remove();
    toast("Usuario removido de la lista autorizada. Su cuenta de acceso no se borra sola — para eso, contacta al soporte de Firebase.", "ok");
  } catch(e) {
    toast("No se pudo eliminar: "+e.message, "danger");
  }
}

/* Antes acá se usaba auth.fetchSignInMethodsForEmail(email) para decidir
   si mostrar "crea tu contraseña" o "inicia sesión". Firebase cambió el
   comportamiento de esa función por una protección de privacidad
   ("email enumeration protection"): ahora casi siempre devuelve una
   lista vacía, sin importar si la cuenta existe o no — por eso, en un
   dispositivo nuevo (sin sesión ya guardada), la app siempre terminaba
   creyendo que era "primer acceso" aunque la cuenta ya existiera desde
   otro dispositivo. En el dispositivo original nunca se notaba, porque
   Firebase ya lo tenía con la sesión iniciada y nunca volvía a pasar
   por acá.

   La solución no depende de que Firebase nos diga si la cuenta existe:
   directamente se intenta iniciar sesión, y solo si eso falla se intenta
   crear la cuenta — Firebase igual va a rechazar la creación con
   "auth/email-already-in-use" si la cuenta ya existía, lo que nos dice
   con certeza que el problema real era la contraseña, no que faltara
   crear la cuenta. */
async function continuarLogin() {
  const email = (document.getElementById("loginEmail").value||"").trim().toLowerCase();
  if (!email || !email.includes("@")) { toast("Ingresa un correo válido.", "danger"); return; }

  const autorizado = DB.usuariosAutorizados[sanitizarEmailKey(email)];
  if (!autorizado) {
    document.getElementById("loginArea").innerHTML = `
      <div class="ai-note" style="background:var(--danger-bg); border-color:#e7bfae; color:var(--danger);">
        Este correo no está autorizado todavía. Pídele a tu Jefe de Proyecto que te agregue en "Gestionar usuarios" con tu correo y tu cargo.
      </div>
      <button class="btn" style="width:100%; justify-content:center; margin-top:12px;" onclick="renderPasoEmail()">← Volver</button>
    `;
    return;
  }
  renderPasoPassword(email, autorizado);
}

function renderPasoPassword(email, autorizado) {
  document.getElementById("loginArea").innerHTML = `
    <div class="small muted" style="margin-bottom:10px;">${autorizado.nombre} · ${autorizado.rol}</div>
    <label class="field-label">Contraseña</label>
    <input type="password" id="loginPass" placeholder="Tu contraseña" onkeydown="if(event.key==='Enter') intentarAccesoLogin('${email}');">
    <div class="hint">¿Primera vez que entras a ALUTIPO PMO desde cualquier dispositivo? Escribe la contraseña que quieres usar (mínimo 6 caracteres) y quedará creada. Si ya tienes cuenta, solo ingresa tu contraseña de siempre.</div>
    <button class="btn btn-primary" style="width:100%; justify-content:center; margin-top:12px;" onclick="intentarAccesoLogin('${email}')">Ingresar</button>
    <div style="text-align:center; margin-top:10px;">
      <a href="#" class="small" onclick="olvideMiClave('${email}'); return false;">¿Olvidaste tu contraseña?</a>
    </div>
    <button class="btn" style="width:100%; justify-content:center; margin-top:8px;" onclick="renderPasoEmail()">← Volver</button>
  `;
  setTimeout(()=>{ const el = document.getElementById("loginPass"); if(el) el.focus(); }, 50);
}

async function intentarAccesoLogin(email) {
  const pass = document.getElementById("loginPass").value;
  if (!pass || pass.length < 6) { toast("La contraseña debe tener al menos 6 caracteres.", "danger"); return; }
  try {
    await auth.signInWithEmailAndPassword(email, pass);
    // éxito — onAuthStateChanged toma el control desde acá
  } catch (errLogin) {
    try {
      await auth.createUserWithEmailAndPassword(email, pass);
      // éxito creando la cuenta — onAuthStateChanged toma el control desde acá
    } catch (errCrear) {
      if (errCrear.code === "auth/email-already-in-use") {
        toast("Contraseña incorrecta. Si la olvidaste, usa '¿Olvidaste tu contraseña?' abajo.", "danger");
      } else {
        toast("No se pudo ingresar: "+traducirErrorAuth(errCrear), "danger");
      }
    }
  }
}
async function olvideMiClave(email) {
  try {
    await auth.sendPasswordResetEmail(email);
    toast(`Te enviamos un correo a ${email} con instrucciones para crear una contraseña nueva.`, "ok");
  } catch(e) {
    toast("No se pudo enviar el correo: "+traducirErrorAuth(e), "danger");
  }
}
function traducirErrorAuth(e) {
  const map = {
    "auth/wrong-password": "contraseña incorrecta.",
    "auth/user-not-found": "no existe una cuenta con ese correo.",
    "auth/invalid-credential": "correo o contraseña incorrectos.",
    "auth/email-already-in-use": "ya existe una cuenta con ese correo — usa 'Iniciar sesión' en vez de crear una nueva.",

    "auth/invalid-email": "el correo no es válido.",
    "auth/too-many-requests": "demasiados intentos — espera unos minutos e inténtalo de nuevo.",
  };

/* =====================================================================
   PRESENCIA — quién está conectado ahora mismo, en tiempo real.
   Patrón estándar de Firebase: cada sesión escribe una entrada bajo
   /presencia mientras dura la conexión, y Firebase la borra solo
   (onDisconnect) apenas se cierra la pestaña o se pierde la conexión —
   no depende de que el navegador avise "me fui" correctamente.
   ===================================================================== */
/* =====================================================================
   PRESENCIA — quién está conectado ahora mismo, en tiempo real.
   Patrón estándar de Firebase: cada sesión escribe una entrada bajo
   /presencia mientras dura la conexión, y Firebase la borra sola
   (onDisconnect) apenas se cierra la pestaña o se pierde la conexión.

   PROBLEMA QUE ESTO CORRIGE: cada vez que ".info/connected" vuelve a
   true (reconexión tras una caída de wifi, el celular se bloquea y
   despierta, la laptop sale de suspensión, etc.) este bloque se
   ejecuta de nuevo y creaba una entrada NUEVA sin borrar la anterior
   — el onDisconnect de la conexión vieja a veces nunca llega a
   dispararse en el servidor. Resultado: "sesiones fantasma" que
   inflan el contador de conectados (eso era el "5 conectados" con un
   solo navegador abierto). Se corrige con dos capas:
   1) Se borra explícitamente la referencia anterior antes de crear la
      nueva, en cada reconexión.
   2) Un "latido" (heartbeat) cada 60s actualiza ultimaSenal; cualquier
      entrada sin señal hace más de 3 min se considera desconectada
      para el conteo visible, y cualquier cliente conectado ayuda a
      borrar (best-effort) las que llevan más de 30 min sin señal —
      así los fantasmas ya existentes se autolimpian con el tiempo.
   ===================================================================== */
const PRESENCIA_TTL_VISIBLE_MS = 3*60*1000;   // sin señal > 3 min → no se muestra como conectado
const PRESENCIA_TTL_PURGA_MS = 30*60*1000;    // sin señal > 30 min → se borra del todo (fantasma)

function configurarPresencia() {
  database.ref('.info/connected').on('value', (snap) => {
    if (snap.val() === true) {
      if (miPresenciaRef) { try { miPresenciaRef.remove(); } catch(e) {} }
      miPresenciaRef = presenciaRef.push();
      miPresenciaRef.onDisconnect().remove();
      miPresenciaRef.set({ usuario: DB.usuario, rol: DB.role, pagina: currentPage, desde: Date.now(), ultimaSenal: Date.now() });
    }
  });
  presenciaRef.on('value', (snap) => {
    const val = snap.val() || {};
    const ahora = Date.now();
    listaConectados = Object.entries(val)
      .map(([id, v]) => ({id, ...v}))
      .filter(c => (ahora - (c.ultimaSenal || c.desde || 0)) < PRESENCIA_TTL_VISIBLE_MS);
    Object.entries(val).forEach(([id, v]) => {
      if ((ahora - (v.ultimaSenal || v.desde || 0)) > PRESENCIA_TTL_PURGA_MS) {
        presenciaRef.child(id).remove().catch(()=>{});
      }
    });
    renderBadgeConectados();
  });
  setInterval(actualizarMiPresencia, 60000); // latido: mantiene "ultimaSenal" fresca mientras la pestaña siga abierta
}
function actualizarMiPresencia() {
  if (!miPresenciaRef) return;
  miPresenciaRef.update({ usuario: DB.usuario, rol: DB.role, pagina: currentPage, ultimaSenal: Date.now() }).catch(()=>{});
}

/* Chat de Requerimientos — un solo listener sobre TODO /mensajes (el
   volumen esperado es modesto para un equipo de este tamaño, mismo
   criterio de simplicidad que ya usa el resto de la app). Cada cambio
   — mensaje nuevo, marcado como requerimiento, cambio de estado —
   dispara este callback y se re-renderiza solo; no depende de
   guardarEstado()/stateRef en absoluto. */
function configurarMensajes() {
  mensajesRef.on('value', (snap) => {
    DB.mensajes = snap.val() || {};
    renderAll();
  });
}
function configurarBitacoraPunch() {
  bitacoraPunchRef.on('value', (snap) => {
    DB.bitacoraPunch = snap.val() || {};
    renderAll();
  });
}
function requerimientosAbiertosGlobal() {
  return Object.values(DB.mensajes||{}).flatMap(sala=>Object.values(sala||{})).filter(m=>m.req && m.req.estado!=='resuelta').length;
}
function esMiPresencia(id) { return miPresenciaRef && id === miPresenciaRef.key; }

function tiempoDesde(ts) {
  if (!ts) return "";
  const min = Math.floor((Date.now() - ts) / 60000);
  if (min < 1) return "recién";
  if (min < 60) return `hace ${min} min`;
  const h = Math.floor(min/60);
  return `hace ${h} h`;
}

function renderBadgeConectados() {
  const el = document.getElementById("conectadosBadge");
  if (!el) return;
  const n = listaConectados.length;

    <span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px;"></span>${n} conectado${n!==1?'s':''}

}

      <div class="flex-between"><h3 style="font-size:13px;">Conectados ahora</h3><button class="close-x" onclick="togglePanelConectados()">✕</button></div>
      <div class="stack" style="margin-top:8px;">
        ${ordenados.length ? ordenados.map(c => `

            <div><b>${c.usuario||'Usuario'}</b>${esMiPresencia(c.id)?' <span class="hint">(tú)</span>':''}<div class="hint">${c.rol||''}${c.pagina?` · viendo ${c.pagina}`:''}</div></div>
            <span class="hint">${tiempoDesde(c.desde)}</span>
          </div>
        `).join('') : '<div class="hint">Nadie más conectado ahora.</div>'}
      </div>
    </div>`;
}

function cambiarEstadoPosta(pid, numero, nuevoEstado, motivo) {
  const p = proy(pid);
  const t = p.postas.find(x => x.numero === numero);
  if (!t) return false;

  if (!puedeOperarPosta(t)) {
    toast(`Tu rol (${DB.role}) no tiene permiso para operar esta posta. Responsable: ${t.responsable}.`, "danger");
    return false;
  }
  if ((nuevoEstado==="En Progreso" || nuevoEstado==="Lista para Iniciar") && !habilitada(p,t)) {
    toast("No se puede iniciar: hay postas predecesoras sin completar (cascada de dependencias).", "danger");
    return false;
  }
  if (nuevoEstado==="Bloqueado" && !motivo) {
    toast("El bloqueo requiere un motivo obligatorio.", "danger");
    return false;
  }
  if (nuevoEstado==="Completado" && t.estado==="Completado") {
    toast("Esta posta ya está completada. Requiere Solicitud de Reapertura con 4 firmas.", "warn");
    return false;
  }
  if (nuevoEstado==="Completado" && numero===19) {
    const pendientes = p.punch.filter(x => x.estado !== "Completado");
    if (pendientes.length > 0) {
      toast(`No se puede cerrar: quedan ${pendientes.length} ítems de Punch List sin completar.`, "danger");
      return false;
    }
  }

  const estadoAnterior = t.estado;
  t.estado = nuevoEstado;
  if (nuevoEstado==="Bloqueado") {
    t.motivoBloqueo = motivo; t.fechaBloqueo = hoyISO();
  }
  if (nuevoEstado==="En Progreso" && !t.fechaInicio) t.fechaInicio = hoyISO();
  if (nuevoEstado==="Completado") {
    t.avance = 100; t.fechaCompletado = hoyISO(); t.motivoBloqueo = null;
  }
  if (estadoAnterior==="Bloqueado" && nuevoEstado!=="Bloqueado") {
    t.motivoResolucion = motivo || "Resuelto";
  }

  registrarHistorial({
    proyecto:p.codigo, accion:"Modificar", detalle:`Posta ${numero} · ${t.nombre}: ${estadoAnterior} → ${nuevoEstado}`,
    usuario:DB.usuario+" · "+DB.role, criticidad: nuevoEstado==="Bloqueado"?"Alta":(t.hito?"Media":"Baja")
  });

  p.avanceCache = avanceGlobal(p);
  p.semaforoCache = semaforo(p);

  toast(`Posta ${numero} actualizada a "${nuevoEstado}".`, "ok");
  guardarEstado();
  return true;
}

/* Comentario + link de SharePoint por posta — abierto a cualquier rol que
   pueda operar esa posta (no solo el que cambia el estado), para dejar
   visibilidad real del avance sin depender de un cambio de estado. */
function guardarComentarioPosta(pid, numero, comentario, linkSharepoint) {
  const p = proy(pid);
  const t = p.postas.find(x => x.numero === numero);
  if (!t) return false;
  if (!puedeOperarPosta(t)) {
    toast(`Tu rol (${DB.role}) no puede comentar esta posta. Responsable: ${t.responsable}.`, "danger");
    return false;
  }
  if (linkSharepoint && !/^https?:\/\//i.test(linkSharepoint.trim())) {
    toast("El link debe empezar con http:// o https://", "danger");
    return false;
  }
  t.comentario = (comentario||"").trim();
  t.linkSharepoint = (linkSharepoint||"").trim();
  t.comentarioPor = t.comentario || t.linkSharepoint ? (DB.usuario+" · "+DB.role) : "";
  t.comentarioFecha = t.comentario || t.linkSharepoint ? hoyISO() : "";
  registrarHistorial({
    proyecto:p.codigo, accion:"Modificar",
    detalle:`Posta ${numero} · ${t.nombre}: comentario/evidencia actualizado`,
    usuario:DB.usuario+" · "+DB.role, criticidad:"Baja"
  });
  toast(`Comentario de la posta ${numero} guardado.`, "ok");
  guardarEstado();
  return true;
}

/* Estado de stock computado en vivo (no se guarda como campo fijo, para
   que siempre refleje stock vs mínimo real, incluso tras un ajuste manual
   o una entrada automática por recepción). */
function calcularEstadoStock(b) {
  const stock = Number(b.stock)||0, minimo = Number(b.minimo)||0;
  if (stock <= 0 && minimo > 0) return "Crítico";
  if (minimo > 0 && stock < minimo) return "Bajo Mínimo";
  return "Normal";
}

function puedeGestionarBodega() { return puedeGestionarCompras(); }

/* Busca en bodega un material por nombre (insensible a mayúsculas/acentos
   simples) — usado tanto por el ingreso manual como por el automático
   desde recepciones, para no duplicar filas del mismo material. */
function buscarBodegaPorNombre(p, nombre) {
  const n = (nombre||"").trim().toLowerCase();
  return p.bodega.find(b => b.material.trim().toLowerCase() === n);
}

function agregarProductoBodega(pid, datos) {
  const p = proy(pid);
  if (!puedeGestionarBodega()) { toast(`Tu rol (${DB.role}) no gestiona bodega.`, "danger"); return false; }
  if (!datos.material || !datos.material.trim()) { toast("Indica el nombre del material.", "danger"); return false; }
  if (buscarBodegaPorNombre(p, datos.material)) { toast("Ese material ya existe en bodega — usa 'Actualizar stock' en vez de crear uno nuevo.", "danger"); return false; }
  const codigo = (datos.codigo||"").trim() || ("MAT-"+String(1000+p.bodega.length+Math.floor(Math.random()*900)));
  p.bodega.push({
    codigo, material: datos.material.trim(), stock: Number(datos.stock)||0,
    unidad: datos.unidad||"unidad", minimo: Number(datos.minimo)||0,
  });
  registrarHistorial({proyecto:p.codigo, accion:"Crear", detalle:`Producto agregado a bodega: ${datos.material} (${codigo})`, usuario:DB.usuario+" · "+DB.role, criticidad:"Baja"});
  toast("Producto agregado a bodega.", "ok");
  guardarEstado();
  return true;
}

/* Ajuste manual de stock: Ingreso suma, Salida resta (sin bajar de 0),
   Ajuste fija el valor exacto (para correcciones de inventario). */
function ajustarStockBodega(pid, codigo, tipo, cantidad, motivo) {
  const p = proy(pid);
  const b = p.bodega.find(x => x.codigo === codigo);
  if (!b) return false;
  if (!puedeGestionarBodega()) { toast(`Tu rol (${DB.role}) no gestiona bodega.`, "danger"); return false; }
  const cant = Number(cantidad);
  if (isNaN(cant) || cant < 0) { toast("Indica una cantidad válida.", "danger"); return false; }
  const antes = b.stock;
  if (tipo === "Ingreso") b.stock = antes + cant;
  else if (tipo === "Salida") b.stock = Math.max(0, antes - cant);
  else b.stock = cant; // Ajuste a valor exacto
  registrarHistorial({proyecto:p.codigo, accion:"Modificar", detalle:`Bodega ${codigo} (${b.material}): ${tipo} ${tipo==='Ajuste'?'a':''} ${cant} ${b.unidad} — stock ${antes} → ${b.stock}${motivo?` (${motivo})`:''}`, usuario:DB.usuario+" · "+DB.role, criticidad:"Baja"});
  toast(`Stock de ${b.material} actualizado: ${antes} → ${b.stock} ${b.unidad}.`, "ok");
  guardarEstado();
  return true;
}

/* Ingreso automático a bodega cuando se registra una recepción — busca el
   material por nombre y suma; si no existe, lo crea. No pide confirmación
   (se dispara junto con registrarRecepcion) pero queda igual de trazado
   en el historial. */
function ingresarBodegaPorRecepcion(p, itemsRecibidos, factura) {
  itemsRecibidos.forEach(it => {
    if (!it.cantidad || it.cantidad <= 0) return;
    let b = buscarBodegaPorNombre(p, it.descripcion);
    if (!b) {
      b = { codigo:"MAT-"+String(1000+p.bodega.length+Math.floor(Math.random()*900)), material: it.descripcion, stock:0, unidad: it.unidad||"unidad", minimo:0 };
      p.bodega.push(b);
    }
    const antes = b.stock;
    b.stock = antes + it.cantidad;
    registrarHistorial({proyecto:p.codigo, accion:"Modificar", detalle:`Ingreso automático a bodega desde recepción (factura ${factura}): ${b.material} +${it.cantidad} ${b.unidad} (${antes} → ${b.stock})`, usuario:DB.usuario+" · "+DB.role, criticidad:"Baja"});
  });
}

/* =====================================================================
   BODEGA GENERAL — stock de la empresa que NO pertenece a ningún
   proyecto todavía. El encargado de taller lo carga acá (compras sin
   proyecto asignado, sobrantes, devoluciones) y desde acá lo asigna a un
   proyecto específico cuando corresponda, lo que lo mueve al inventario
   de ESE proyecto (Bodega normal).
   ===================================================================== */
function buscarBodegaGeneralPorNombre(nombre) {
  const n = (nombre||"").trim().toLowerCase();
  return DB.bodegaGeneral.find(b => b.material.trim().toLowerCase() === n);
}

function agregarProductoBodegaGeneral(datos) {
  if (!puedeGestionarBodega()) { toast(`Tu rol (${DB.role}) no gestiona bodega.`, "danger"); return false; }
  if (!datos.material || !datos.material.trim()) { toast("Indica el nombre del material.", "danger"); return false; }
  if (buscarBodegaGeneralPorNombre(datos.material)) { toast("Ese material ya existe en la bodega general — usa 'Actualizar stock' en vez de crear uno nuevo.", "danger"); return false; }
  const codigo = (datos.codigo||"").trim() || ("MAT-G-"+String(1000+DB.bodegaGeneral.length+Math.floor(Math.random()*900)));
  const stockInicial = Number(datos.stock)||0;
  const precioTotal = Number(datos.precioTotal)||0;
  // El precio se ingresa como TOTAL pagado por el lote (lo que dice la factura/OC),
  // no por unidad — acá se calcula el valor unitario dividiendo por la cantidad,
  // que es lo que Bsale necesita para crear el producto.
  const precioUnitario = stockInicial>0 ? Math.round(precioTotal/stockInicial) : 0;
  DB.bodegaGeneral.push({
    codigo, material: datos.material.trim(), stock: stockInicial,
    unidad: datos.unidad||"unidad", minimo: Number(datos.minimo)||0,
    precioUnitario,
  });
  registrarHistorial({proyecto:"General", accion:"Crear", detalle:`Producto agregado a bodega general: ${datos.material} (${codigo})${precioUnitario?` — precio unitario $${precioUnitario}`:''}`, usuario:DB.usuario+" · "+DB.role, criticidad:"Baja"});
  toast("Producto agregado a la bodega general.", "ok");
  guardarEstado();
  return true;
}

function ajustarStockBodegaGeneral(codigo, tipo, cantidad, motivo, precioTotalIngreso) {
  const b = DB.bodegaGeneral.find(x => x.codigo === codigo);
  if (!b) return false;
  if (!puedeGestionarBodega()) { toast(`Tu rol (${DB.role}) no gestiona bodega.`, "danger"); return false; }
  const cant = Number(cantidad);
  if (isNaN(cant) || cant < 0) { toast("Indica una cantidad válida.", "danger"); return false; }
  const antes = b.stock;
  let notaPrecio = "";
  if (tipo === "Ingreso") {
    const totalIngreso = Number(precioTotalIngreso)||0;
    if (totalIngreso > 0 && cant > 0) {
      // promedio ponderado entre lo que ya había valorizado al precio unitario
      // actual, y el lote nuevo que entra a otro precio.
      const precioAntes = b.precioUnitario || 0;
      const nuevoUnitario = Math.round(((antes*precioAntes) + totalIngreso) / (antes+cant));
      notaPrecio = ` — precio unitario ${precioAntes}→${nuevoUnitario}`;
      b.precioUnitario = nuevoUnitario;
    }
    b.stock = antes + cant;
  }
  else if (tipo === "Salida") b.stock = Math.max(0, antes - cant);
  else b.stock = cant;
  registrarHistorial({proyecto:"General", accion:"Modificar", detalle:`Bodega general ${codigo} (${b.material}): ${tipo} ${cant} ${b.unidad} — stock ${antes} → ${b.stock}${notaPrecio}${motivo?` (${motivo})`:''}`, usuario:DB.usuario+" · "+DB.role, criticidad:"Baja"});
  toast(`Stock de ${b.material} actualizado: ${antes} → ${b.stock} ${b.unidad}.`, "ok");
  guardarEstado();
  return true;
}

/* Mueve cantidad desde la bodega general al inventario de un proyecto
   específico — resta de general, suma (o crea) en el proyecto destino. */
function asignarBodegaGeneralAProyecto(codigoGeneral, proyectoId, cantidad) {
  const b = DB.bodegaGeneral.find(x => x.codigo === codigoGeneral);
  if (!b) return false;
  if (!puedeGestionarBodega()) { toast(`Tu rol (${DB.role}) no gestiona bodega.`, "danger"); return false; }
  const p = proy(proyectoId);
  if (!p) { toast("Selecciona un proyecto válido.", "danger"); return false; }
  const cant = Number(cantidad);
  if (isNaN(cant) || cant <= 0) { toast("Indica una cantidad válida.", "danger"); return false; }
  if (cant > b.stock) { toast(`Solo hay ${b.stock} ${b.unidad} disponibles en bodega general.`, "danger"); return false; }

  b.stock -= cant;
  let destino = buscarBodegaPorNombre(p, b.material);
  if (!destino) {
    destino = { codigo:"MAT-"+String(1000+p.bodega.length+Math.floor(Math.random()*900)), material: b.material, stock:0, unidad: b.unidad, minimo:0 };
    p.bodega.push(destino);
  }
  destino.stock += cant;

  registrarHistorial({proyecto:"General → "+p.codigo, accion:"Modificar", detalle:`${cant} ${b.unidad} de "${b.material}" asignados desde bodega general a ${p.codigo}`, usuario:DB.usuario+" · "+DB.role, criticidad:"Media"});
  toast(`${cant} ${b.unidad} de ${b.material} asignados a ${p.codigo}.`, "ok");
  guardarEstado();
  return true;
}

/* Registra un evento de recepción contra una factura específica,
   seleccionando cuánto llegó de CADA ítem (porque en la práctica cada
   factura suele traer solo algunos de los ítems de la cotización).
   itemsRecibidos: [{itemId, cantidad}] — solo los que realmente llegaron
   en esta factura, con la cantidad que llegó de cada uno. */
function registrarRecepcion(pid, cotId, datos) {
  const p = proy(pid);
  const c = p.cotizaciones.find(x => x.id === cotId);
  if (!c) return false;
  if (!puedeGestionarCompras()) {
    toast(`Tu rol (${DB.role}) no gestiona compras.`, "danger");
    return false;
  }
  if (!datos.factura || !datos.factura.trim()) {
    toast("Debes indicar el N° de factura con la que llegó.", "danger");
    return false;
  }
  const seleccion = (datos.itemsRecibidos||[]).filter(x => Number(x.cantidad) > 0);
  if (!seleccion.length) {
    toast("Selecciona al menos un ítem con cantidad recibida mayor a 0.", "danger");
    return false;
  }

  const itemsParaBodega = [];
  seleccion.forEach(sel => {
    const it = c.items.find(x => x.id === sel.itemId);
    if (!it) return;
    const pendiente = (Number(it.cantidad)||0) - (Number(it.cantidadRecibida)||0);
    const cantidadEsta = Math.min(Number(sel.cantidad)||0, Math.max(0, pendiente));
    if (cantidadEsta <= 0) return;
    it.cantidadRecibida = (Number(it.cantidadRecibida)||0) + cantidadEsta;
    itemsParaBodega.push({ descripcion: it.descripcion, cantidad: cantidadEsta, unidad: it.unidad });
  });

  if (!itemsParaBodega.length) {
    toast("No hay cantidades válidas para registrar (revisa lo que ya estaba recibido).", "danger");
    return false;
  }

  c.recepciones.push({
    fecha: hoyISO(), factura: datos.factura.trim(),
    items: itemsParaBodega,
    notas: (datos.notas||"").trim(),
    registradoPor: DB.usuario+" · "+DB.role,
  });

  const todoRecibido = c.items.every(it => (Number(it.cantidadRecibida)||0) >= (Number(it.cantidad)||0));
  c.estado = todoRecibido ? "Recibido" : "Recibido Parcial";
  if (c.estado==="Recibido") c.alerta = "";

  ingresarBodegaPorRecepcion(p, itemsParaBodega, datos.factura.trim());

  registrarHistorial({proyecto:p.codigo, accion:"Modificar", detalle:`Cotización ${cotId}: recepción registrada con factura ${datos.factura} (${itemsParaBodega.length} ítem(s)) → ${c.estado}`, usuario:DB.usuario+" · "+DB.role, criticidad:"Media"});
  toast(`Recepción registrada (factura ${datos.factura}) y agregada a bodega.`, "ok");
  guardarEstado();
  return true;
}

/* Crea o edita una cotización completa (con sus ítems). datos.items es un
   array de {descripcion, cantidad, unidad, montoNeto}. */
function guardarCotizacion(pid, cotId, datos) {
  const p = proy(pid);
  if (!puedeGestionarCompras()) {
    toast(`Tu rol (${DB.role}) no gestiona compras. Responsable: Asistente Administrativo.`, "danger");
    return false;
  }
  if (!datos.proveedor) { toast("Debes indicar el proveedor.", "danger"); return false; }

  const cotExistente = cotId ? p.cotizaciones.find(x => x.id === cotId) : null;
  const yaTieneRecepciones = cotExistente && cotExistente.recepciones && cotExistente.recepciones.length > 0;

  let items;
  if (yaTieneRecepciones) {
    // No se pueden reescribir los ítems una vez que ya hay recepciones
    // registradas contra ellos (se perdería la trazabilidad de cuánto
    // llegó de cada uno). Los cambios de cantidad/ítems después de este
    // punto deben hacerse desde "Registrar recepción".
    items = cotExistente.items;
  } else {
    const itemsValidos = (datos.items||[]).filter(it => it.descripcion && it.descripcion.trim());
    if (!itemsValidos.length) { toast("Agrega al menos un ítem con descripción.", "danger"); return false; }
    items = itemsValidos.map((it, i) => ({
      id: i+1, descripcion: it.descripcion.trim(), cantidad: Number(it.cantidad)||1,
      unidad: it.unidad||"unidad", montoNeto: Number(it.montoNeto)||0, cantidadRecibida: 0,
    }));
  }

  if (cotId) {
    const c = p.cotizaciones.find(x => x.id === cotId);
    if (!c) return false;
    Object.assign(c, {
      numeroCotizacion: datos.numeroCotizacion||"", proveedor: datos.proveedor,
      referencia: datos.referencia||"", importancia: datos.importancia||"Media",
      linkSharepoint: datos.linkSharepoint||"", longLead: !!datos.longLead,
      fechaEstim: datos.fechaEstim||"", items,
    });
    if (datos.numeroOC !== undefined) c.numeroOC = datos.numeroOC;
    if (datos.linkOC !== undefined) c.linkOC = datos.linkOC;
    registrarHistorial({proyecto:p.codigo, accion:"Modificar", detalle:`Cotización editada: ${cotId} (${datos.proveedor})`, usuario:DB.usuario+" · "+DB.role, criticidad:"Baja"});
    toast(`Cotización ${cotId} actualizada.`, "ok");
  } else {
    const id = "COT-"+String(500 + p.cotizaciones.length + 1 + Math.floor(Math.random()*90));
    p.cotizaciones.push({
      id, numeroCotizacion: datos.numeroCotizacion||"", proveedor: datos.proveedor,
      fecha: hoyISO(), referencia: datos.referencia||"", importancia: datos.importancia||"Media",
      linkSharepoint: datos.linkSharepoint||"", estado: "Cotizando",
      longLead: !!datos.longLead, fechaEstim: datos.fechaEstim||"", items,
      numeroOC: "", linkOC: "", recepciones: [],
    });
    registrarHistorial({proyecto:p.codigo, accion:"Crear", detalle:`Nueva cotización: ${datos.proveedor} (${id})`, usuario:DB.usuario+" · "+DB.role, criticidad:"Baja"});
    toast(`${id} creada en estado "Cotizando".`, "ok");
  }
  guardarEstado();
  return true;
}

/* =====================================================================
   PUNCH LIST — rediseñado para tareas con muchos sub-ítems (ej: 130
   cargas de un cableado), donde el % de avance se calcula solo a partir
   de cuántos sub-ítems están marcados. Tareas sin sub-ítems mantienen el
   selector simple de estado de siempre.
   ===================================================================== */
function avancePunchItem(it) {
  if (Array.isArray(it.subitems) && it.subitems.length) {
    const suma = it.subitems.reduce((s, sub) => s + (Number(sub.avance)||0), 0);
    return Math.round(suma / it.subitems.length);
  }
  return it.estado === "Completado" ? 100 : (it.estado === "En Progreso" ? 50 : 0);
}
/* Solo estos roles pueden llevar un sub-ítem al 100% — cualquier otro
   puede reportar avance libremente hasta 99%, pero el cierre final
   queda para quien verifica en terreno o la jefatura. */
const ROLES_CIERRE_SUBITEM = ["Líder de Terreno", "Jefe de Proyecto", "Gerencia"];
function puedeCerrarSubitem() { return ROLES_CIERRE_SUBITEM.includes(DB.role); }
/* Avance global del Punch List del proyecto: promedio simple entre
   tareas (cada tarea pesa igual, sin importar si tiene 2 o 130
   sub-ítems) — así "sumar cada tarea" da el 100% del conjunto. */
function avancePunchProyecto(p) {
  if (!p.punch.length) return 0;
  const suma = p.punch.reduce((s, it) => s + avancePunchItem(it), 0);
  return Math.round(suma / p.punch.length);
}
function estadoDesdeAvance(pct) {
  if (pct >= 100) return "Completado";
  if (pct > 0) return "En Progreso";
  return "No Iniciado";
}
function fechaUrgencia(fecha) {
  if (!fecha) return "sin-fecha";
  const dias = diasEntre(hoyISO(), fecha);
  if (dias < 0) return "vencido";
  if (dias <= 5) return "proximo";
  return "ok";
}

/* =====================================================================
   PUNCH LIST → CARTA GANTT: cada tarea de Punch List con fecha de inicio
   Y término queda reflejada como una tarea más en Planificación,
   identificada por origenPunchId para poder actualizarla en vez de
   duplicarla cada vez que cambia. Si le borran las fechas o se elimina
   la tarea de Punch List, se quita también de la Gantt.
   ===================================================================== */
function sincronizarPunchAGanttObj(p, it) {
  if (!it || !it.fechaInicio || !it.fechaTermino) {
    p.planificacion = p.planificacion.filter(t => t.origenPunchId !== (it&&it.id));
    return;
  }
  let tarea = p.planificacion.find(t => t.origenPunchId === it.id);
  if (!tarea) {
    const nextId = (p.planificacion.reduce((m,t)=>Math.max(m,t.id),0))+1;
    tarea = { id: nextId, origenPunchId: it.id, predecesores: [] };
    p.planificacion.push(tarea);
  }
  Object.assign(tarea, {
    nombre: "🔧 " + it.desc,
    fase: "Punch List",
    responsable: it.disciplina,
    inicio: it.fechaInicio,
    fin: it.fechaTermino,
    avance: avancePunchItem(it),
    hito: false,
  });
}
/* Wrapper para llamar desde acciones normales de la UI, donde el
   proyecto ya está en DB.proyectos y se puede buscar por id. */
function sincronizarPunchAGantt(pid, punchId) {
  const p = proy(pid);
  if (!p) return;
  const it = p.punch.find(x => x.id === punchId);
  if (!it) {
    p.planificacion = p.planificacion.filter(t => t.origenPunchId !== punchId);
    return;
  }
  sincronizarPunchAGanttObj(p, it);
}

function cambiarEstadoPunch(pid, id, nuevoEstado) {
  const p = proy(pid);
  const it = p.punch.find(x => x.id === id);
  if (!it) return;
  if (Array.isArray(it.subitems) && it.subitems.length) {
    toast("Esta tarea tiene sub-ítems — marca cada uno en el detalle en vez de cambiar el estado directamente.", "danger");
    return;
  }
  it.estado = nuevoEstado;
  sincronizarPunchAGantt(pid, id);
  registrarHistorial({proyecto:p.codigo, accion:"Modificar", detalle:`Punch ${id}: → ${nuevoEstado}`, usuario:DB.usuario+" · "+DB.role, criticidad:"Baja"});
  toast(`Ítem de Punch List ${id} → ${nuevoEstado}.`, "ok");
  guardarEstado();
}

function agregarPunch(pid, datos) {
  const p = proy(pid);
  const n = p.punch.length+1;
  const id = "PL-"+String(n+ (p.id==="P1"?0:900)).padStart(3,'0')+"-"+Math.floor(Math.random()*90+10);
  if (!datos.desc || !datos.desc.trim()) { toast("Describe la tarea.", "danger"); return false; }
  p.punch.push({
    id, desc: datos.desc.trim(), disciplina: datos.disciplina||"Eléctrico", importancia: datos.importancia||"Media",
    fechaInicio: datos.fechaInicio||"", fechaTermino: datos.fechaTermino||"", estado:"No Iniciado", subitems: [],
  });
  sincronizarPunchAGantt(pid, id);
  registrarHistorial({proyecto:p.codigo, accion:"Crear", detalle:`Nueva tarea Punch List: ${datos.desc}`, usuario:DB.usuario+" · "+DB.role, criticidad:"Baja"});
  toast("Tarea agregada al Punch List.", "ok");
  guardarEstado();
  return true;
}

function editarPunch(pid, id, datos) {
  const p = proy(pid);
  const it = p.punch.find(x => x.id === id);
  if (!it) return false;
  if (!datos.desc || !datos.desc.trim()) { toast("Describe la tarea.", "danger"); return false; }
  it.desc = datos.desc.trim(); it.disciplina = datos.disciplina||it.disciplina;
  it.importancia = datos.importancia||it.importancia;
  it.fechaInicio = datos.fechaInicio||""; it.fechaTermino = datos.fechaTermino||"";
  sincronizarPunchAGantt(pid, id);
  registrarHistorial({proyecto:p.codigo, accion:"Modificar", detalle:`Punch ${id} editado: ${it.desc}`, usuario:DB.usuario+" · "+DB.role, criticidad:"Baja"});
  toast("Tarea actualizada.", "ok");
  guardarEstado();
  return true;
}

function eliminarPunch(pid, id) {
  const p = proy(pid);
  const it = p.punch.find(x => x.id === id);
  p.punch = p.punch.filter(x => x.id !== id);
  p.planificacion = p.planificacion.filter(t => t.origenPunchId !== id);
  registrarHistorial({proyecto:p.codigo, accion:"Eliminar", detalle:`Tarea Punch List eliminada: ${it?it.desc:id}`, usuario:DB.usuario+" · "+DB.role, criticidad:"Media"});
  toast("Tarea eliminada.", "ok");
  guardarEstado();
}

/* Actualiza el % de avance de un sub-ítem individual (ej: una carga
   específica) mediante un control deslizante 0-100, y recalcula el %
   del padre. El 100% está reservado a roles de verificación/cierre —
   cualquier otro rol queda topado en 99% aunque intente arrastrar más. */
function actualizarAvanceSubitem(pid, punchId, subId, valor) {
  const p = proy(pid);
  const it = p.punch.find(x => x.id === punchId);
  if (!it) return;
  const sub = (it.subitems||[]).find(s => s.id === subId);
  if (!sub) return;
  let v = Math.max(0, Math.min(100, Math.round(Number(valor)||0)));
  if (v >= 100 && !puedeCerrarSubitem()) {
    v = 99;
    toast("El 100% solo lo puede confirmar Líder de Terreno, Jefe de Proyecto o Gerencia — se dejó en 99%.", "danger");
  }
  sub.avance = v;
  sub.actualizadoPor = v>0 ? (DB.usuario+" · "+DB.role) : "";
  sub.actualizadoFecha = v>0 ? hoyISO() : "";
  it.estado = estadoDesdeAvance(avancePunchItem(it));
  sincronizarPunchAGantt(pid, punchId);
  registrarHistorial({proyecto:p.codigo, accion:"Modificar", detalle:`Punch ${punchId}: "${sub.nombre}" → ${v}% (${avancePunchItem(it)}% de la tarea)`, usuario:DB.usuario+" · "+DB.role, criticidad:"Baja"});
  guardarEstado();
  return v;
}

/* Genera sub-ítems numerados en un rango, con prefijo opcional
   (ej: prefijo "C-", desde 101, hasta 130 → C-101 ... C-130). */
function agregarSubitemsRango(pid, punchId, prefijo, desde, hasta) {
  const p = proy(pid);
  const it = p.punch.find(x => x.id === punchId);
  if (!it) return false;
  const d = parseInt(desde), h = parseInt(hasta);
  if (isNaN(d) || isNaN(h) || h < d) { toast("Rango inválido.", "danger"); return false; }
  if ((h-d) > 500) { toast("Rango demasiado grande (máx. 500 de una vez).", "danger"); return false; }
  if (!it.subitems) it.subitems = [];
  let nextId = (it.subitems.reduce((m,s)=>Math.max(m,s.id),0))+1;
  for (let n=d; n<=h; n++) {
    it.subitems.push({id: nextId++, nombre: (prefijo||"")+n, avance:0, asignadoPersonaId:"", asignadoNota:"", actualizadoPor:"", actualizadoFecha:""});
  }
  it.estado = estadoDesdeAvance(avancePunchItem(it));
  registrarHistorial({proyecto:p.codigo, accion:"Crear", detalle:`Punch ${punchId}: generados ${h-d+1} sub-ítems (${prefijo||''}${d} a ${prefijo||''}${h})`, usuario:DB.usuario+" · "+DB.role, criticidad:"Baja"});
  toast(`${h-d+1} sub-ítems agregados.`, "ok");
  guardarEstado();
  return true;
}

/* Genera sub-ítems a partir de una lista pegada (uno por línea o
   separados por coma) — para identificadores reales no correlativos,
   ej: números de carga tal como están en el plano. */
function agregarSubitemsPegado(pid, punchId, texto) {
  const p = proy(pid);
  const it = p.punch.find(x => x.id === punchId);
  if (!it) return false;
  const nombres = texto.split(/[\n,]/).map(s => s.trim()).filter(Boolean);
  if (!nombres.length) { toast("Pega al menos un identificador.", "danger"); return false; }
  if (!it.subitems) it.subitems = [];
  let nextId = (it.subitems.reduce((m,s)=>Math.max(m,s.id),0))+1;
  nombres.forEach(n => it.subitems.push({id: nextId++, nombre:n, avance:0, asignadoPersonaId:"", asignadoNota:"", actualizadoPor:"", actualizadoFecha:""}));
  it.estado = estadoDesdeAvance(avancePunchItem(it));
  registrarHistorial({proyecto:p.codigo, accion:"Crear", detalle:`Punch ${punchId}: agregados ${nombres.length} sub-ítems desde lista pegada`, usuario:DB.usuario+" · "+DB.role, criticidad:"Baja"});
  toast(`${nombres.length} sub-ítems agregados.`, "ok");
  guardarEstado();
  return true;
}
