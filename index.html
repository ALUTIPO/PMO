/* Cruce Personal ↔ Punch List: todas las tareas/sub-ítems de un proyecto
   asignados a una persona en particular, con su avance — es la base de
   la "Vista por trabajador". */
function tareasPunchDePersona(proyectoId, personaId) {
  const p = proy(proyectoId);
  if (!p) return [];
  const resultado = [];
  p.punch.forEach(it => {
    const base = { punchId: it.id, tarea: it.desc, fechaInicio: it.fechaInicio||"", fechaTermino: it.fechaTermino||"", disciplina: it.disciplina||"", importancia: it.importancia||"" };
    if (it.asignadoPersonaId === personaId) {
      resultado.push(Object.assign({}, base, { subitem: null, subId: null, avance: avancePunchItem(it), estado: it.estado }));
    }
    (it.subitems||[]).forEach(sub => {
      if (sub.asignadoPersonaId === personaId) {
        resultado.push(Object.assign({}, base, { subitem: sub.nombre, subId: sub.id, avance: sub.avance||0, estado: estadoDesdeAvance(sub.avance||0) }));
      }
    });
  });
  return resultado;
}

/* Igual que tareasPunchDePersona, pero cruzando TODOS los proyectos —
   es la base de "Mi Panel": lo que un trabajador tiene asignado en
   cualquier proyecto donde participe, no solo en el proyecto activo. */
function tareasPunchDePersonaGlobal(personaId) {
  const out = [];
  DB.proyectos.forEach(p => {
    tareasPunchDePersona(p.id, personaId).forEach(t => {
      out.push(Object.assign({}, t, { proyectoId: p.id, proyectoCodigo: p.codigo, proyectoNombre: p.nombre, modoCierre: !!p.modoCierre }));
    });
  });
  return out;
}

/* Calza la sesión iniciada (DB.usuario, puesto por Firebase Auth vía el
   correo autorizado) con su registro en la dotación (DB.personal), por
   nombre — mismo criterio de calce que usa migrarProyecto(). Si el
   nombre en "Personal" no coincide exactamente con el de la cuenta,
   Mi Panel no podrá cruzar tareas y lo advierte en pantalla. */
function personaActual() {
  const nombre = (DB.usuario||"").trim().toLowerCase();
  if (!nombre) return null;
  return DB.personal.find(per => per.nombre.trim().toLowerCase() === nombre) || null;
}

function firmarReapertura(pid, raId, rol) {
  const p = proy(pid);
  const ra = p.reaperturas.find(x => x.id === raId);
  if (!ra) return;
  if (DB.role!==rol && DB.role!=="Gerencia") {
    toast(`Solo ${rol} puede registrar esta firma.`, "danger");
    return;
  }
  ra.firmas[rol] = true;
  const completo = Object.values(ra.firmas).every(v => v === true);
  if (completo) {
    ra.estado="Aprobada";
    const t = p.postas.find(x => x.numero === ra.posta);
    if(t){ t.estado="En Progreso"; t.avance=Math.min(t.avance,90); }
    toast(`Reapertura ${raId} aprobada — Posta ${ra.posta} desbloqueada.`, "ok");
    registrarHistorial({proyecto:p.codigo, accion:"Reabrir", detalle:`Reapertura ${raId} aprobada (4/4 firmas)`, usuario:DB.usuario+" · "+DB.role, criticidad:"Alta"});
  } else {
    toast(`Firma de ${rol} registrada (${Object.values(ra.firmas).filter(Boolean).length}/4).`, "ok");
    registrarHistorial({proyecto:p.codigo, accion:"Aprobar", detalle:`Firma de ${rol} en Reapertura ${raId}`, usuario:DB.usuario+" · "+DB.role, criticidad:"Media"});
  }
  guardarEstado();
}

function crearReapertura(pid, posta, motivo) {
  const p = proy(pid);
  const id = "RA-"+String(p.reaperturas.length+1).padStart(3,'0')+"-"+p.id;
  p.reaperturas.push({id, posta:Number(posta), motivo, solicitante:DB.usuario+" · "+DB.role, fecha:new Date().toISOString().slice(0,10),
    firmas:{Gerencia:false,"Jefe de Proyecto":false,"Jefe de Servicios Eléctricos":false,"Jefe de Automatización":false}, estado:"Pendiente"});
  registrarHistorial({proyecto:p.codigo, accion:"Crear", detalle:`Solicitud de reapertura ${id} para posta ${posta}`, usuario:DB.usuario+" · "+DB.role, criticidad:"Media"});
  toast("Solicitud de reapertura creada. Requiere 4 firmas.", "ok");
  guardarEstado();
}

function analizarProyectoIA(pid) {
  const p = proy(pid);
  const nuevos = [];
  p.postas.filter(t => t.estado==="Bloqueado").forEach(t => {
    const dias = diasBloqueado(t);
    if(dias>=3){
      nuevos.push({
        id:"IA-"+Math.random().toString(36).slice(2,7),
        tipo:"Bloqueo prolongado", severidad: dias>7?"Crítica":(t.hito?"Alta":"Media"),
        descripcion:`La posta ${t.numero} "${t.nombre}" lleva ${dias} día(s) bloqueada (${t.motivoBloqueo||"sin motivo"}). Responsable: ${t.responsable}. Recomendación: escalar a ${t.responsable==="Automatización"?"Jefe de Proyecto":"Jefe de Proyecto"} dentro de 48h.`,
        revisado:false, fecha:new Date().toISOString().slice(0,10)
      });
    }
  });
  p.cotizaciones.filter(c => c.longLead && (c.estado==="Cotizando")).forEach(c => {
    nuevos.push({
      id:"IA-"+Math.random().toString(36).slice(2,7),
      tipo:"Long-lead item", severidad:"Alta",
      descripcion:`La cotización "${c.referencia||c.proveedor}" (${c.id}) es long-lead y aún en "Cotizando". Riesgo de atraso.`,
      revisado:false, fecha:new Date().toISOString().slice(0,10)
    });
  });
  const pres = presupuesto(p);
  if(pres.realDisponiblePct<20){
    nuevos.push({id:"IA-"+Math.random().toString(36).slice(2,7), tipo:"Presupuesto", severidad:"Alta",
      descripcion:`Fondo de compras reales en ${pres.realDisponiblePct}% de disponibilidad. Evaluar ampliación.`, revisado:false, fecha:new Date().toISOString().slice(0,10)});
  }
  if(pres.emerDisponiblePct<20){
    nuevos.push({id:"IA-"+Math.random().toString(36).slice(2,7), tipo:"Presupuesto", severidad:"Media",
      descripcion:`Reserva de emergencia al ${pres.emerDisponiblePct}%.`, revisado:false, fecha:new Date().toISOString().slice(0,10)});
  }
  p.postas.filter(t => t.estado==="En Progreso").forEach(t => {
    if(t.avance < 45){
      nuevos.push({id:"IA-"+Math.random().toString(36).slice(2,7), tipo:"Atraso", severidad:"Baja",
        descripcion:`Posta ${t.numero} "${t.nombre}" con ${t.avance}% de avance. Verificar plazo.`, revisado:false, fecha:new Date().toISOString().slice(0,10)});
    }
  });

  if(nuevos.length===0) {
    toast("Análisis de IA: no se detectaron nuevos riesgos.", "ok");
  } else {
    p.iaRiesgos = nuevos.concat(p.iaRiesgos.filter(r => r.revisado));
    toast(`IA generó ${nuevos.length} hallazgo(s) en borrador.`, "warn");
    registrarHistorial({proyecto:p.codigo, accion:"Crear", detalle:`IA generó ${nuevos.length} riesgo(s)`, usuario:"IA", criticidad:"Media", origen:"IA"});
  }
  guardarEstado();
}

function marcarRevisadoIA(pid, riesgoId) {
  const p = proy(pid);
  const r = p.iaRiesgos.find(x => x.id === riesgoId);
  if (!r) return;
  r.revisado = true;
  registrarHistorial({proyecto:p.codigo, accion:"Aprobar", detalle:`PM revisó hallazgo IA ${riesgoId} (${r.tipo})`, usuario:DB.usuario+" · "+DB.role, criticidad:"Baja"});
  toast("Hallazgo marcado como revisado.", "ok");
  guardarEstado();
}

function generarNarrativaIA(pid) {
  const p = proy(pid);
  const pres = presupuesto(p);
  const av = p.avanceCache != null ? p.avanceCache : avanceGlobal(p);
  const sem = p.semaforoCache || semaforo(p);
  const bloqueadas = p.postas.filter(t => t.estado==="Bloqueado");
  const completadas = p.postas.filter(t => t.estado==="Completado").length;
  let txt = `Proyecto ${p.codigo} — ${p.nombre} (cliente ${p.cliente}) presenta un avance global ponderado de ${av}%, con ${completadas} de 19 postas completadas. `;
  txt += `El semáforo del proyecto está en ${sem.toUpperCase()}. `;
  if(bloqueadas.length){
    txt += `Actualmente hay ${bloqueadas.length} posta(s) bloqueada(s): ${bloqueadas.map(t=>`#${t.numero} (${t.motivoBloqueo||"sin motivo"})`).join("; ")}. `;
  } else { txt += `No hay postas bloqueadas activas. `; }
  txt += `El fondo de compras reales tiene ${pres.realDisponiblePct}% de disponibilidad y la reserva de emergencia ${pres.emerDisponiblePct}%. `;
  const alertas = p.cotizaciones.filter(c => c.alerta);
  if(alertas.length) txt += `Se identifican ${alertas.length} cotización(es) con alerta de long-lead. `;
  txt += `Recomendación: ${sem==="Rojo"?"escalar de inmediato a Gerencia y priorizar la resolución de bloqueos críticos.":sem==="Amarillo"?"monitorear de cerca los puntos señalados en la próxima semana.":"mantener el ritmo actual, sin acciones urgentes."}`;
  return txt;
}

// --- Planificación (Gantt) ---
function diasEntre(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }
function sumarDias(fecha, dias) { const d = new Date(fecha); d.setDate(d.getDate()+dias); return d.toISOString().slice(0,10); }
function parsePredecesoresTexto(texto) {
  if(!texto) return [];
  return texto.split(",").map(s => s.trim()).filter(Boolean).map(s => {
    const m = s.match(/^(\d+)\s*(FS)?\s*([+-]\s*\d+)?/i);
    if(!m) return null;
    return { ref: Number(m[1]), lagDias: m[3] ? Number(m[3].replace(/\s/g,'')) : 0 };
  }).filter(Boolean);
}
function predecesoresATexto(preds) {
  if(!preds || !preds.length) return "";
  return preds.map(p => p.lagDias ? `${p.ref}FS${p.lagDias>0?'+':''}${p.lagDias}d` : `${p.ref}`).join(", ");
}
function calcularCPM(tareas) {
  const map = {};
  tareas.forEach(t => { map[t.id] = { tarea:t, duracion: Math.max(0, diasEntre(t.inicio, t.fin)), ES:0, EF:0, LS:0, LF:0, holgura:0, critica:false }; });
  const visitado = new Set(), orden = [];
  function visitar(id, pila) {
    if(visitado.has(id) || pila.has(id)) return;
    pila.add(id);
    const t = map[id]?.tarea;
    (t?.predecesores||[]).forEach(p => { if(map[p.ref]) visitar(p.ref, pila); });
    pila.delete(id); visitado.add(id); orden.push(id);
  }
  tareas.forEach(t => visitar(t.id, new Set()));
  orden.forEach(id => {
    const n = map[id];
    const preds = n.tarea.predecesores||[];
    if(!preds.length) { n.ES = 0; }
    else { n.ES = Math.max(...preds.map(p => (map[p.ref] ? map[p.ref].EF + (p.lagDias||0) : 0))); }
    n.EF = n.ES + n.duracion;
  });
  const finProyecto = Math.max(0, ...orden.map(id => map[id].EF));
  const sucesores = {};
  tareas.forEach(t => (t.predecesores||[]).forEach(p => { (sucesores[p.ref] ||= []).push({id:t.id, lagDias:p.lagDias||0}); }));
  [...orden].reverse().forEach(id => {
    const n = map[id];
    const sucs = sucesores[id] || [];
    if(!sucs.length) { n.LF = finProyecto; }
    else { n.LF = Math.min(...sucs.map(s => map[s.id].LS - s.lagDias)); }
    n.LS = n.LF - n.duracion;
    n.holgura = n.LS - n.ES;
    n.critica = n.holgura <= 0;
  });
  return map;
}
function ganttSVG(tareas, cpm) {
  const fechas = tareas.flatMap(t => [t.inicio, t.fin]).filter(Boolean);
  const minFecha = fechas.reduce((m,f) => !m || f<m ? f : m, null);
  const maxFecha = fechas.reduce((m,f) => !m || f>m ? f : m, null);
  const inicioRango = sumarDias(minFecha, -3);
  const finRango = sumarDias(maxFecha, 3);
  const totalDias = Math.max(1, diasEntre(inicioRango, finRango));
  const filaAlto = 26, labelAncho = 260, margenTop = 34, diaAncho = Math.max(4, Math.min(10, Math.floor(900/totalDias)));
  const chartAncho = totalDias*diaAncho;
  const svgAncho = labelAncho + chartAncho + 20;
  const svgAlto = margenTop + tareas.length*filaAlto + 20;
  const xDeFecha = (f) => labelAncho + diasEntre(inicioRango, f)*diaAncho;
  let semanas = "";
  for(let d=0; d<=totalDias; d+=7) {
    const x = labelAncho + d*diaAncho;
    const fecha = sumarDias(inicioRango, d);
    semanas += `<line x1="${x}" y1="${margenTop-8}" x2="${x}" y2="${svgAlto-10}" stroke="var(--line-soft)" stroke-width="1"/>
      <text x="${x+3}" y="${margenTop-14}" font-size="9" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${fecha.slice(5)}</text>`;
  }
  const hoy = hoyISO();
  const xHoy = xDeFecha(hoy);
  const lineaHoy = (xHoy>=labelAncho && xHoy<=svgAncho-20) ? `<line x1="${xHoy}" y1="${margenTop-8}" x2="${xHoy}" y2="${svgAlto-10}" stroke="var(--copper)" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="${xHoy+3}" y="${svgAlto-2}" font-size="9" fill="var(--copper-dark)" font-family="IBM Plex Mono, monospace">hoy</text>` : "";
  let filas = "";
  tareas.forEach((t,i) => {
    const y = margenTop + i*filaAlto;
    const c = cpm[t.id] || {};
    const colorBarra = c.critica ? "var(--danger)" : "var(--blueprint)";
    filas += `<text x="8" y="${y+filaAlto/2+4}" font-size="11.5" fill="var(--ink)">${(t.nombre.length>36 ? t.nombre.slice(0,35)+'…' : t.nombre)}</text>`;
    if(t.hito) {
      const x = xDeFecha(t.inicio);
      filas += `<rect x="${x-6}" y="${y+4}" width="12" height="12" transform="rotate(45 ${x} ${y+10})" fill="${t.avance>=100?'var(--ok)':'var(--copper)'}"/>`;
    } else {
      const x1 = xDeFecha(t.inicio), x2 = xDeFecha(t.fin);
      const w = Math.max(3, x2-x1);
      filas += `<rect x="${x1}" y="${y+3}" width="${w}" height="14" rx="3" fill="${colorBarra}" opacity="0.28"/>
        <rect x="${x1}" y="${y+3}" width="${w*(t.avance/100)}" height="14" rx="3" fill="${colorBarra}"/>`;
    }
  });
  return `<svg viewBox="0 0 ${svgAncho} ${svgAlto}" width="100%" style="min-width:${svgAncho}px; font-family:'IBM Plex Sans',sans-serif;">
    <line x1="${labelAncho}" y1="${margenTop-10}" x2="${labelAncho}" y2="${svgAlto-8}" stroke="var(--line)" stroke-width="1"/>
    ${semanas}
    ${lineaHoy}
    ${filas}
  </svg>`;
}

/* Botón de acción según la etapa actual de la cotización — cada etapa
   dispara su propio flujo (correo, modal), no un simple "siguiente estado". */
function accionesEtapaCotizacion(p, c) {
  switch(c.estado) {
    case "Cotizando":
      return `<button class="btn btn-sm btn-primary" onclick="modalSolicitarOC('${p.id}', '${c.id}')">✉ Solicitar OC</button>`;
    case "OC Solicitada":
      return `<button class="btn btn-sm btn-primary" onclick="modalRegistrarNumeroOC('${p.id}', '${c.id}')">✔ Registrar N° de OC</button>`;
    case "OC Emitida":
      return `<button class="btn btn-sm btn-primary" onclick="modalNotificarProveedor('${p.id}', '${c.id}')">✉ Notificar despacho a proveedor</button>`;
    case "En Tránsito":
    case "Recibido Parcial":
      return `<button class="btn btn-sm btn-primary" onclick="modalRegistrarRecepcion('${p.id}', '${c.id}')">📦 Registrar recepción</button>`;
    case "Recibido":
      return `<span class="hint">Ciclo cerrado</span>`;
    default:
      return '';
  }
}

/* Exporta la Bodega General a un .xlsx con encabezados pensados para el
   importador masivo de Bsale (Productos y servicios / Stock). Bsale deja
   mapear manualmente cada columna del Excel a sus propios campos al
   cargarlo, así que no hace falta replicar su plantilla exacta — basta
   con encabezados claros y datos limpios. Se arman dos hojas: una para
   dar de alta productos nuevos y otra solo con SKU + Stock, para cuando
   el producto ya existe en Bsale y solo se quiere actualizar cantidad. */
/* El formato de columnas de acá abajo (SKU, Variante, Stock, Costo Neto,
   Serie, Moneda, Tipo de Cambio) no es un invento nuestro — es la
   plantilla real que exporta Bsale (confirmada contra un export real
   de la cuenta), así que el archivo generado se puede subir directo
   al importador de Stock de Bsale sin reordenar columnas. */
function exportarBodegaExcelBsale() {
  if (typeof XLSX === "undefined") { toast("No se pudo cargar el generador de Excel. Revisa tu conexión a internet e intenta de nuevo.", "danger"); return; }
  if (!DB.bodegaGeneral.length) { toast("La bodega general está vacía — no hay nada que exportar.", "danger"); return; }

  const filas = DB.bodegaGeneral.map(b => ({
    "SKU": b.codigo,
    "Variante": b.material,
    "Stock": b.stock,
    "Costo Neto": b.precioUnitario || 0,
    "Serie": "",
    "Moneda": "",
    "Tipo de Cambio": "",
  }));

  const wb = XLSX.utils.book_new();
  const hoja = XLSX.utils.json_to_sheet(filas);
  XLSX.utils.book_append_sheet(wb, hoja, "Stock");

  const nombreArchivo = `Bodega_Alutipo_para_Bsale_${hoyISO()}.xlsx`;
  XLSX.writeFile(wb, nombreArchivo);
  registrarHistorial({proyecto:"General", accion:"Exportar", detalle:`Bodega general exportada a Excel para Bsale (${DB.bodegaGeneral.length} productos)`, usuario:DB.usuario+" · "+DB.role, criticidad:"Baja"});
  guardarEstado();
  toast(`Descargado: ${nombreArchivo}`, "ok");
}

/* =====================================================================
   IMPORTAR bodega desde Excel — acepta el mismo formato de arriba
   (SKU, Variante, Stock, Costo Neto), con nombres de columna
   flexibles (con o sin tilde, "Nombre" en vez de "Variante", etc.)
   para no depender de que el archivo venga exactamente parejo.
   Si el SKU ya existe en la bodega, actualiza stock y precio en vez
   de duplicar; si no existe, crea el producto.
   ===================================================================== */
let _importBodegaFilas = [];

function normalizarHeaderBodega(s) {
  return (s||"").toString().trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}
function mapearFilaImportBodega(row) {
  const entradas = Object.entries(row).map(([k,v]) => [normalizarHeaderBodega(k), v]);
  const buscar = (opciones) => { for (const [k,v] of entradas) { if (opciones.includes(k)) return v; } return ""; };
  const sku = buscar(["sku","codigo"]);
  const nombre = buscar(["variante","nombre","material","producto","descripcion"]);
  const stock = buscar(["stock","cantidad"]);
  const costo = buscar(["costo neto","costo","precio unitario","precio"]);
  return { sku: (sku||"").toString().trim(), nombre: (nombre||"").toString().trim(), stock: Number(stock)||0, costo: Number(costo)||0 };
}

function modalImportarBodegaExcel() {
  if (!puedeGestionarBodega()) { toast(`Tu rol (${DB.role}) no gestiona bodega.`, "danger"); return; }
  _importBodegaFilas = [];
  openModal(`
    <div class="modal-head"><h3>Importar productos desde Excel</h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="hint" style="margin-bottom:10px;">Acepta el mismo formato de Bsale: columnas <b>SKU</b>, <b>Variante</b> (nombre) o <b>Nombre</b>, <b>Stock</b> y <b>Costo Neto</b> (precio unitario). Si un SKU ya existe en tu bodega, se actualiza en vez de duplicarse.</div>
      <label class="field-label">Archivo (.xlsx, .xls o .csv)</label>
      <input type="file" id="bgImportFile" accept=".xlsx,.xls,.csv" onchange="previsualizarImportBodega(this)">
      <div id="bgImportPreview" style="margin-top:14px;"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="bgImportConfirmBtn" disabled onclick="confirmarImportBodegaExcel()">Importar</button>
    </div>
  `);
}

function previsualizarImportBodega(input) {
  const file = input.files[0];
  const preview = document.getElementById('bgImportPreview');
  const btn = document.getElementById('bgImportConfirmBtn');
  if (!file) { preview.innerHTML=''; btn.disabled=true; return; }
  if (typeof XLSX === "undefined") { preview.innerHTML = `<div class="hint" style="color:var(--danger)">No se pudo cargar el lector de Excel. Revisa tu conexión.</div>`; return; }
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const wb = XLSX.read(e.target.result, {type:'array'});
      const hoja = wb.Sheets[wb.SheetNames[0]];
      const filas = XLSX.utils.sheet_to_json(hoja, {defval:""});
      _importBodegaFilas = filas.map(mapearFilaImportBodega).filter(f => f.sku || f.nombre);
      if (!_importBodegaFilas.length) {
        preview.innerHTML = `<div class="hint" style="color:var(--danger)">No se encontraron filas con SKU o nombre. Revisa que la primera hoja tenga encabezados.</div>`;
        btn.disabled = true;
        return;
      }
      const yaExisten = _importBodegaFilas.filter(f => f.sku && DB.bodegaGeneral.some(b=>b.codigo===f.sku)).length;
      preview.innerHTML = `
        <div class="hint">Se detectaron <b>${_importBodegaFilas.length}</b> productos. ${yaExisten? `<b>${yaExisten}</b> ya existen en tu bodega y se actualizarán (stock + precio); el resto se crea nuevo.` : 'Todos son nuevos.'}</div>
        <div class="table-wrap" style="margin-top:8px; max-height:220px; overflow-y:auto;">
          <table><tr><th>SKU</th><th>Nombre</th><th>Stock</th><th>Costo</th></tr>
          ${_importBodegaFilas.slice(0,8).map(f=>`<tr><td class="mono">${f.sku||'—'}</td><td>${f.nombre||'—'}</td><td class="mono">${f.stock}</td><td class="mono">$${f.costo.toLocaleString('es-CL')}</td></tr>`).join('')}
          </table>
        </div>
        ${_importBodegaFilas.length>8 ? `<div class="hint" style="margin-top:6px;">+${_importBodegaFilas.length-8} más…</div>` : ''}
      `;
      btn.disabled = false;
    } catch(err) {
      preview.innerHTML = `<div class="hint" style="color:var(--danger)">No se pudo leer el archivo: ${err.message}</div>`;
      btn.disabled = true;
    }
  };
  reader.readAsArrayBuffer(file);
}

function confirmarImportBodegaExcel() {
  if (!puedeGestionarBodega()) { toast(`Tu rol (${DB.role}) no gestiona bodega.`, "danger"); return; }
  if (!_importBodegaFilas.length) return;
  let creados = 0, actualizados = 0;
  _importBodegaFilas.forEach(f => {
    if (!f.sku && !f.nombre) return;
    let b = f.sku ? DB.bodegaGeneral.find(x=>x.codigo===f.sku) : null;
    if (!b && f.nombre) b = DB.bodegaGeneral.find(x=>x.material.trim().toLowerCase()===f.nombre.trim().toLowerCase());
    if (b) {
      b.stock = f.stock || b.stock;
      if (f.costo>0) b.precioUnitario = f.costo;
      actualizados++;
    } else {
      const codigo = f.sku || ("MAT-G-"+String(1000+DB.bodegaGeneral.length+Math.floor(Math.random()*900)));
      DB.bodegaGeneral.push({ codigo, material: f.nombre||codigo, stock: f.stock||0, unidad:"unidad", minimo:0, precioUnitario: f.costo||0 });
      creados++;
    }
  });
  registrarHistorial({proyecto:"General", accion:"Crear", detalle:`Importación masiva a bodega general desde Excel: ${creados} nuevos, ${actualizados} actualizados`, usuario:DB.usuario+" · "+DB.role, criticidad:"Baja"});
  guardarEstado();
  closeModal();
  renderAll();
  toast(`Importación completa: ${creados} nuevos, ${actualizados} actualizados.`, "ok");
}

/* Cuerpo compartido entre Mi Panel y Panel de Equipo: KPIs, tarea más
   urgente, gráficos de estado/proyecto, listado filtrable y actividad
   reciente — todo calculado para la `persona` recibida. */
function cuerpoPanelTrabajador(persona) {
  const todas = tareasPunchDePersonaGlobal(persona.id);
  const pendientes = todas.filter(t => t.avance < 100);
  const vencidas = todas.filter(t => t.fechaTermino && fechaUrgencia(t.fechaTermino)==='vencido' && t.avance<100);
  const proximas = todas.filter(t => t.fechaTermino && fechaUrgencia(t.fechaTermino)==='proximo' && t.avance<100);
  const enProgreso = todas.filter(t => t.estado==='En Progreso').length;
  const avancePromedio = pendientes.length ? Math.round(pendientes.reduce((s,t)=>s+t.avance,0)/pendientes.length) : (todas.length ? 100 : 0);

  const counts = {
    noiniciado: todas.filter(t=>t.estado==='No Iniciado').length,
    progreso: enProgreso,
    completado: todas.filter(t=>t.estado==='Completado').length,
  };

  const urgentes = [...vencidas, ...proximas].sort((a,b) => (a.fechaTermino||'').localeCompare(b.fechaTermino||''));
  const top = urgentes[0];

  let lista = todas;
  if (filtroMiPanel==='pendientes') lista = pendientes;
  else if (filtroMiPanel==='progreso') lista = todas.filter(t=>t.estado==='En Progreso');
  else if (filtroMiPanel==='vencidas') lista = vencidas;
  lista = lista.slice().sort((a,b) => (a.fechaTermino||'9999-99-99').localeCompare(b.fechaTermino||'9999-99-99'));

  const porProyecto = {};
  todas.forEach(t => { porProyecto[t.proyectoCodigo] = (porProyecto[t.proyectoCodigo]||0)+1; });
  const maxProyecto = Math.max(1, ...Object.values(porProyecto));

  const conteoTabs = {todas: todas.length, pendientes: pendientes.length, progreso: enProgreso, vencidas: vencidas.length};

    <div class="flex-between">
      <h3 style="font-size:14px;">📌 Requerimientos asignados</h3>
      <span class="badge ${reqAsignados[0].req.urgencia==='critica'?'b-rojo':'b-amarillo'}"><span class="dot"></span>${reqAsignados.length} abierto(s)</span>
    </div>
    <div class="stack" style="gap:0; margin-top:6px;">
      ${reqAsignados.slice(0,4).map(r => {
        const proyDe = DB.proyectos.find(p=>p.id===r.salaId);

  </div>` : ''}

  <div class="grid grid-2" style="margin-top:20px; align-items:start;">

      <h3>Tareas por proyecto</h3>
      <div class="stack" style="gap:10px; margin-top:10px;">

  <div class="section-label" style="margin-top:22px;">Tareas</div>

    ${['todas','pendientes','progreso','vencidas'].map(f => `<button class="btn btn-sm ${filtroMiPanel===f?'btn-primary':''}" onclick="filtroMiPanel='${f}'; renderAll();">${labelTabs[f]} · ${conteoTabs[f]}</button>`).join('')}

}

/* Donut de estado dibujado a mano en SVG (mismo criterio que la carta
   Gantt del módulo de Planificación: nada de librerías externas). */
function svgDonutEstados(counts) {
  const total = counts.noiniciado + counts.progreso + counts.completado;
  if (!total) return `<div class="empty-state small">Sin tareas para graficar.</div>`;
  const segs = [
    {v:counts.completado, color:'var(--ok)'},
    {v:counts.progreso, color:'var(--copper)'},
    {v:counts.noiniciado, color:'var(--muted)'},
  ];
  const r = 46, cx = 60, cy = 60, circ = 2*Math.PI*r;
  let offset = 0;
  const arcos = segs.filter(s=>s.v>0).map(s => {
    const dash = (s.v/total)*circ;
    const el = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="15" stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset += dash;
    return el;
  }).join('');
  const pctCompletado = Math.round(counts.completado/total*100);
  return `<svg viewBox="0 0 120 120" width="120" height="120">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line)" stroke-width="15"/>
    ${arcos}
    <text x="${cx}" y="${cy-4}" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="20" font-weight="700" fill="var(--ink)">${pctCompletado}%</text>
    <text x="${cx}" y="${cy+13}" text-anchor="middle" font-size="9.5" fill="var(--muted)">completado</text>
  </svg>`;
}

/* Cruce Personal ↔ Punch List: para el proyecto elegido en el filtro de
   arriba, muestra a cada persona con lo que tiene asignado — tanto su
   rango de fechas en el proyecto como sus tareas/sub-ítems puntuales del
   Punch List, con avance. Es la vista que necesita un Jefe de Proyecto
   para saber "¿qué está haciendo cada técnico ahora mismo?". */
function renderVistaPorTrabajador() {
  if (filtroAsignacionProyecto === "todos") {
    return `
    <div class="section-label">Vista por trabajador</div>
    <div class="empty-state card">Elige un proyecto específico en el filtro de arriba para ver, por cada persona, su rango de fechas junto con sus tareas del Punch List en ese proyecto.</div>
    `;
  }
  const p = proy(filtroAsignacionProyecto);
  if (!p) return '';
  const asigProyecto = DB.asignaciones.filter(a => a.proyectoId === p.id);
  const personasConTareas = new Set(
    p.punch.flatMap(it => [it.asignadoPersonaId, ...(it.subitems||[]).map(s=>s.asignadoPersonaId)]).filter(Boolean)
  );
  const idsRelevantes = new Set([...asigProyecto.map(a=>a.personaId), ...personasConTareas]);

  if (!idsRelevantes.size) {
    return `
    <div class="section-label">Vista por trabajador — ${p.codigo}</div>
    <div class="empty-state card">Nadie tiene asignación ni tareas de Punch List en este proyecto todavía.</div>
    `;
  }

  return `
  <div class="section-label">Vista por trabajador — ${p.codigo}</div>
  <div class="stack">
    ${[...idsRelevantes].map(personaId => {
      const per = DB.personal.find(x => x.id === personaId);
      if (!per) return '';
      const asignaciones = asigProyecto.filter(a => a.personaId === personaId);
      const tareas = tareasPunchDePersona(p.id, personaId);
      return `<div class="card">
        <div class="flex-between">
          <div><b>${per.nombre}</b> <span class="hint">${per.cargo}</span></div>
        </div>
        ${asignaciones.length ? asignaciones.map(a => `<div class="hint" style="margin-top:4px;">📅 ${a.dias} · ${a.fechaInicio} → ${a.fechaFin}${a.notas?` — ${a.notas}`:''}</div>`).join('') : `<div class="hint" style="margin-top:4px;">Sin rango de fechas asignado a este proyecto — solo tiene tareas de Punch List.</div>`}
        ${tareas.length ? `
          <div class="divider"></div>
          <div class="small" style="font-weight:600; margin-bottom:6px;">Tareas de Punch List (${tareas.length})</div>
          <div class="stack" style="gap:6px;">
            ${tareas.map(t => `
              <div class="flex-between small">
                <span>${t.tarea}${t.subitem?` — ${t.subitem}`:''}</span>
                <span class="flex-gap">${badgePunch(t.estado)}<b class="mono">${t.avance}%</b></span>
              </div>
            `).join('')}
          </div>
        ` : `<div class="hint" style="margin-top:8px;">Sin tareas de Punch List asignadas todavía en este proyecto.</div>`}
      </div>`;
    }).join('')}
  </div>
  `;
}

/* =====================================================================
   BITÁCORA DE PUNCH LIST — comentarios + fotos por tarea/sub-ítem,
   independiente del % de avance. Pueden agregar entradas: quien tiene
   la tarea asignada, y cualquiera de los roles que ya pueden cerrar un
   sub-ítem al 100% (Líder de Terreno, Jefe de Proyecto, Gerencia) —
   mismo criterio de "supervisor" que ya usa el resto de la app.
   ===================================================================== */
function claveBitacora(punchId, subId) { return (subId!=null) ? (punchId+"__"+subId) : punchId; }
function puedeComentarPunch(it, sub) {
  if (puedeCerrarSubitem()) return true;
  const yo = personaActual();
  if (!yo) return false;
  const asignadoId = sub ? sub.asignadoPersonaId : it.asignadoPersonaId;
  return asignadoId === yo.id;
}
function contarBitacora(proyectoId, punchId, subId) {
  const clave = claveBitacora(punchId, subId);
  return Object.keys(((DB.bitacoraPunch[proyectoId]||{})[clave])||{}).length;
}

/* Redimensiona la foto en el propio celular ANTES de subirla — sube
   mucho más rápido con mala señal en terreno y ocupa una fracción del
   espacio en Firebase Storage. 1280px de ancho máximo es de sobra para
   ver el detalle de una instalación en pantalla. */
function comprimirImagenBitacora(file, maxAncho, calidad) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("No se pudo leer la imagen."));
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => reject(new Error("Archivo de imagen inválido."));
      img.onload = () => {
        const escala = Math.min(1, maxAncho / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * escala);
        canvas.height = Math.round(img.height * escala);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error("No se pudo comprimir la imagen.")), 'image/jpeg', calidad);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
async function subirFotoBitacora(file, proyectoId, clave, indice) {
  const comprimida = await comprimirImagenBitacora(file, 1280, 0.75);
  const ref = storage.ref(`punchFotos/${proyectoId}/${clave}/${Date.now()}_${indice}.jpg`);
  await ref.put(comprimida, {contentType:'image/jpeg'});
  return await ref.getDownloadURL();
}

let _bitacoraFotosSeleccionadas = [];

function renderListaBitacora(proyectoId, punchId, subId) {
  const clave = claveBitacora(punchId, subId);
  const dict = ((DB.bitacoraPunch[proyectoId]||{})[clave]) || {};

  if (!entradas.length) return `<div class="empty-state small">Todavía no hay comentarios en esta tarea.</div>`;
  return `<div class="stack" style="gap:10px; max-height:280px; overflow-y:auto;">

      </div>
    `).join('')}

}

async function enviarBitacoraPunch(proyectoId, punchId, subId) {
  const texto = (document.getElementById('bitacoraTexto').value||"").trim();
  if (!texto && !_bitacoraFotosSeleccionadas.length) { toast("Escribe un comentario o agrega al menos una foto.", "danger"); return; }
  const btn = document.getElementById('bitacoraEnviarBtn');
  if (btn) { btn.disabled = true; btn.textContent = "Subiendo…"; }
  const clave = claveBitacora(punchId, subId);
  try {
    const urls = [];
    for (let i=0; i<_bitacoraFotosSeleccionadas.length; i++) {
      urls.push(await subirFotoBitacora(_bitacoraFotosSeleccionadas[i], proyectoId, clave, i));
    }
    await bitacoraPunchRef.child(proyectoId).child(clave).push({ autor: DB.usuario, rol: DB.role, texto, fotos: urls, ts: Date.now() });
    registrarHistorial({proyecto: proy(proyectoId)?.codigo||proyectoId, accion:"Crear", detalle:`Comentario en Punch List (${punchId}${subId!=null?' / '+subId:''})${urls.length?` con ${urls.length} foto(s)`:''}`, usuario:DB.usuario+" · "+DB.role, criticidad:"Baja"});
    guardarEstado();
    _bitacoraFotosSeleccionadas = [];
    modalBitacoraPunch(proyectoId, punchId, subId);
  } catch(err) {
    toast("No se pudo publicar: "+(err.message||err), "danger");
    if (btn) { btn.disabled = false; btn.textContent = "Publicar"; }
  }
}

function renderTareaPunch(p, it) {
  const avance = avancePunchItem(it);
  const tieneSub = it.subitems && it.subitems.length;

  const urgenciaColor = {vencido:'var(--danger)', proximo:'var(--copper-dark)', ok:'var(--muted)', 'sin-fecha':'var(--muted)'}[urgencia];
  const enGantt = p.planificacion.some(t => t.origenPunchId === it.id);
  const responsable = it.asignadoPersonaId ? DB.personal.find(per => per.id === it.asignadoPersonaId) : null;
  return `<div class="card">
    <div class="flex-between" style="flex-wrap:wrap; gap:8px; cursor:${tieneSub?'pointer':'default'};" ${tieneSub?`onclick="toggleExpandirPunch('${it.id}')"`:''}>
      <div class="flex-gap" style="align-items:flex-start;">
        ${tieneSub ? `<span class="mono" style="font-size:15px; color:var(--muted); user-select:none;">${abierto?'▼':'▶'}</span>` : '<span style="width:15px;"></span>'}
        <div>
          <div class="mono muted small">${it.id}</div>
          <h3 style="margin-top:2px; font-size:14.5px;">${it.desc}</h3>
          <div class="flex-gap" style="margin-top:6px; flex-wrap:wrap;">
            <span class="badge b-gris"><span class="dot"></span>${it.disciplina}</span>
            ${badgeImportancia(it.importancia)}
            ${it.fechaInicio || it.fechaTermino ? `<span class="small" style="color:${urgenciaColor}">📅 ${it.fechaInicio||'?'} → ${it.fechaTermino||'?'}${urgencia==='vencido'?' (vencido)':urgencia==='proximo'?' (próximo)':''}</span>` : ''}
            ${enGantt ? `<span class="small" style="color:var(--blueprint)">🔧 en Gantt</span>` : ''}
            ${responsable ? `<span class="small" style="color:var(--ink-3)">👤 ${responsable.nombre}</span>` : ''}

    <div style="margin-top:12px;">
      <div class="flex-between small"><span>${tieneSub ? `${it.subitems.filter(s=>(s.avance||0)===100).length} / ${it.subitems.length} completados` : 'Avance'}</span><b>${avance}%</b></div>
      <div class="progressbar" style="margin-top:5px;"><span style="width:${avance}%"></span></div>
    </div>
    <div class="flex-gap" style="margin-top:12px; flex-wrap:wrap;">
      ${tieneSub ? `<button class="btn btn-sm" onclick="toggleExpandirPunch('${it.id}')">${abierto?'Ocultar':'Ver'} ${it.subitems.length} sub-ítem${it.subitems.length!==1?'s':''}</button>`
        : `<select onchange="cambiarEstadoPunch('${p.id}','${it.id}',this.value); renderAll();" style="font-size:11.5px;padding:6px 8px;border-radius:6px;border:1px solid var(--line)" onclick="event.stopPropagation()">
            <option ${it.estado==='No Iniciado' ? 'selected' : ''}>No Iniciado</option>
            <option ${it.estado==='En Progreso' ? 'selected' : ''}>En Progreso</option>
            <option ${it.estado==='Completado' ? 'selected' : ''}>Completado</option>
          </select>
          <button class="btn btn-sm" onclick="event.stopPropagation(); toggleExpandirPunch('${it.id}');">+ Agregar sub-ítems</button>`}
      <button class="btn btn-sm" onclick="event.stopPropagation(); modalPunchForm('${p.id}','${it.id}')">Editar</button>
      <button class="btn btn-sm" onclick="event.stopPropagation(); modalBitacoraPunch('${p.id}','${it.id}', null)">💬 ${contarBitacora(p.id, it.id, null)||''} Comentarios</button>
      <button class="btn btn-sm btn-danger" onclick="event.stopPropagation(); if(confirm('¿Eliminar esta tarea del Punch List?')){ eliminarPunch('${p.id}','${it.id}'); renderAll(); }">Eliminar</button>

/* Árbol desplegable: el detalle de sub-ítems vive directo en la página,
   no en un modal aparte — así se puede tener más de una tarea abierta
   a la vez y no se pierde el contexto de las demás. */
function renderDetallePunchInline(p, it) {
  const subs = it.subitems||[];
  const nCompleto = subs.filter(s=>(s.avance||0)===100).length;
  const nProceso = subs.filter(s=>(s.avance||0)>0 && (s.avance||0)<100).length;
  const nPendiente = subs.length - nCompleto - nProceso;
  const tope = puedeCerrarSubitem() ? 100 : 99;
  return `
    <div onclick="event.stopPropagation()">
      <div class="flex-between small"><span>${nCompleto} completados · ${nProceso} en proceso · ${nPendiente} pendientes</span></div>
      ${!puedeCerrarSubitem() ? `<div class="ai-note" style="margin:8px 0;">Con tu rol (${DB.role}) puedes reportar avance hasta 99%. El cierre a 100% lo confirma Líder de Terreno, Jefe de Proyecto o Gerencia.</div>` : ''}

      ${subs.length > 8 ? `<input type="text" id="filtroSubitems_${it.id}" placeholder="Filtrar por nombre (ej: C-45)..." oninput="filtrarSubitems('${it.id}', this.value)" style="margin:8px 0;">` : ''}

      <div id="subitemsGrid_${it.id}" style="max-height:340px; overflow-y:auto;">
        ${subs.length ? `<div class="table-wrap"><table>
          <tr><th>Sub-ítem</th><th>Estado</th><th style="min-width:170px;">Progreso</th><th>Asignado a</th><th></th><th></th></tr>
          ${subs.map(s => `
            <tr data-nombre="${s.nombre.toLowerCase()}">
              <td class="small mono">${s.nombre}</td>
              <td>${badgePunch(estadoDesdeAvance(s.avance||0))}</td>
              <td>
                <div class="flex-gap">
                  <input type="range" min="0" max="${tope}" value="${Math.min(s.avance||0, tope)}" style="flex:1;"
                    oninput="document.getElementById('avanceLabel_${s.id}').textContent = this.value + '%';"
                    onchange="actualizarAvanceSubitem('${p.id}','${it.id}',${s.id}, this.value); renderAll();">
                  <span id="avanceLabel_${s.id}" class="mono small" style="width:38px; text-align:right;">${s.avance||0}%</span>
                </div>
              </td>
              <td>
                <select style="padding:4px 6px; font-size:11.5px;" onchange="asignarSubitem('${p.id}','${it.id}',${s.id}, this.value)">
                  <option value="">— sin asignar —</option>
                  ${DB.personal.map(per => `<option value="${per.id}" ${s.asignadoPersonaId===per.id?'selected':''}>${per.nombre}</option>`).join('')}
                </select>
                ${s.asignadoNota ? `<div class="hint" style="margin-top:2px;">antes: "${s.asignadoNota}"</div>` : ''}
              </td>
              <td><button class="btn btn-sm" onclick="modalBitacoraPunch('${p.id}','${it.id}', ${s.id})" title="Comentarios y fotos">💬 ${contarBitacora(p.id, it.id, s.id)||''}</button></td>
              <td><button class="btn btn-sm btn-danger" onclick="eliminarSubitemPunch('${p.id}','${it.id}',${s.id}); renderAll();">✕</button></td>
            </tr>
          `).join('')}
        </table></div>` : '<div class="hint">Sin sub-ítems todavía — agrega abajo.</div>'}
      </div>

      <div class="divider"></div>
      <div class="section-label">Agregar sub-ítems por rango numerado</div>
      <div class="grid grid-2" style="gap:10px;">
        <div><label class="field-label">Prefijo (opcional)</label><input type="text" id="subPrefijo_${it.id}" placeholder="Ej: C-"></div>
        <div class="grid grid-2" style="gap:6px;">
          <div><label class="field-label">Desde</label><input type="text" id="subDesde_${it.id}" placeholder="101"></div>
          <div><label class="field-label">Hasta</label><input type="text" id="subHasta_${it.id}" placeholder="130"></div>
        </div>
      </div>
      <button class="btn btn-sm" style="margin-top:8px;" onclick="
        agregarSubitemsRango('${p.id}','${it.id}', document.getElementById('subPrefijo_${it.id}').value, document.getElementById('subDesde_${it.id}').value, document.getElementById('subHasta_${it.id}').value);
        renderAll();">Generar rango</button>

      <div class="section-label">O pegar una lista (uno por línea, o separados por coma)</div>
      <textarea id="subPegado_${it.id}" rows="3" placeholder="C-101&#10;C-102&#10;C-103"></textarea>
      <button class="btn btn-sm" style="margin-top:8px;" onclick="
        agregarSubitemsPegado('${p.id}','${it.id}', document.getElementById('subPegado_${it.id}').value);
        renderAll();">Agregar lista</button>
    </div>
  `;
}
function filtrarSubitems(punchId, texto) {
  const t = texto.trim().toLowerCase();
  document.querySelectorAll(`#subitemsGrid_${punchId} tr[data-nombre]`).forEach(row => {
    row.style.display = row.getAttribute('data-nombre').includes(t) ? '' : 'none';
  });
}

// --- Reaperturas ---
/* =====================================================================
   REQUERIMIENTOS — chat libre por proyecto (+ sala "General"), donde
   cualquier mensaje se puede marcar como requerimiento con seguimiento.
   Hereda el mismo "proyecto activo" (DB.proyectoActivo) que ya usan
   Punch List / Planificación / Presupuesto — no tiene selector propio.
   Los mensajes viven en su propio nodo de Firebase (mensajesRef, ver
   configurarMensajes()), no en DB.proyectos ni en stateRef.
   ===================================================================== */

// quién levanta el requerimiento → a quién lo puede asignar (definido junto al Jefe de Proyecto)
const ROLES_REQ_RESTRINGIDO = ["Técnico de Terreno","Automatista"];
const ASIGNABLES_REQ_RESTRINGIDO = ["Jefe de Automatización","Jefe de Servicios Eléctricos","Jefe de Proyecto"];
// sugerencia automática de a quién asignar según el tipo — el usuario siempre puede cambiarla
const SUGERENCIA_REQ_ROL = {
  restringido: {"Duda técnica":"Jefe de Servicios Eléctricos", "Falta material":"Jefe de Proyecto", "Trabajo adicional":"Jefe de Proyecto", "Autorización":"Jefe de Proyecto", "Otro":""},
  libre:       {"Duda técnica":"Diseñador Eléctrico", "Falta material":"Jefe de Taller", "Trabajo adicional":"Jefe de Proyecto", "Autorización":"Jefe de Proyecto", "Otro":""},
};
const URGENCIA_REQ_INFO = {
  critica:{label:"Crítica", clase:"b-rojo"},
  alta:{label:"Alta", clase:"b-amarillo"},
  media:{label:"Media", clase:"b-amarillo"},
  baja:{label:"Baja / informativo", clase:"b-gris"},
};
const ESTADO_REQ_INFO = {
  abierta:{label:"Abierta", clase:"b-rojo"},
  en_proceso:{label:"En proceso", clase:"b-amarillo"},
  resuelta:{label:"Resuelta", clase:"b-verde"},
};
const ESTADO_REQ_SIGUIENTE = {abierta:"en_proceso", en_proceso:"resuelta", resuelta:null};

let contextoChatReq = "proyecto"; // "proyecto" | "general"
let panelReqAbierto = true;
let filtroReq = "todas";

function calcularUrgenciaReq(bloquea, resuelveOtro) {
  if (bloquea && resuelveOtro) return "critica";
  if (bloquea && !resuelveOtro) return "alta";
  if (!bloquea && resuelveOtro) return "media";
  return "baja";
}
function claveSalaActivaReq() { return contextoChatReq==="general" ? "general" : DB.proyectoActivo; }
function requerimientosCriticosAbiertos() {
  const out = [];
  Object.entries(DB.mensajes||{}).forEach(([salaId, dict]) => {
    Object.entries(dict||{}).forEach(([id,m]) => { if (m.req && m.req.urgencia==='critica' && m.req.estado!=='resuelta') out.push({...m, id, salaId}); });
  });
  return out;
}
function requerimientosAsignadosA(nombre) {
  const out = [];
  Object.entries(DB.mensajes||{}).forEach(([salaId, dict]) => {
    Object.entries(dict||{}).forEach(([id,m]) => { if (m.req && m.req.asignadoA===nombre && m.req.estado!=='resuelta') out.push({...m, id, salaId}); });
  });
  const orden = {critica:0, alta:1, media:2, baja:3};
  return out.sort((a,b) => orden[a.req.urgencia]-orden[b.req.urgencia]);
}
function inicialesNombre(nombre) { return (nombre||"?").split(" ").map(p=>p[0]).slice(0,2).join("").toUpperCase(); }
function opcionesAsignacionReq() {
  const restringido = ROLES_REQ_RESTRINGIDO.includes(DB.role);
  const todos = Object.values(DB.usuariosAutorizados||{});
  return restringido ? todos.filter(u => ASIGNABLES_REQ_RESTRINGIDO.includes(u.rol)) : todos;
}
function sugerenciaAsignadoReq(tipo) {
  const restringido = ROLES_REQ_RESTRINGIDO.includes(DB.role);
  const rolSugerido = SUGERENCIA_REQ_ROL[restringido?'restringido':'libre'][tipo];
  if (!rolSugerido) return "";
  const candidato = opcionesAsignacionReq().find(u => u.rol===rolSugerido);
  return candidato ? candidato.nombre : "";
}

function renderRequerimientos() {
  if (!DB.proyectos.length) contextoChatReq = "general";
  const criticasAbiertas = Object.values(DB.mensajes||{}).flatMap(sala=>Object.values(sala||{})).filter(m=>m.req && m.req.urgencia==='critica' && m.req.estado!=='resuelta').length;

  return `
  <div class="page-head">
    <div>
      <h1>Requerimientos</h1>
      <div class="page-desc">Conversación libre por proyecto — cualquier mensaje se puede marcar como requerimiento, con seguimiento visible para todos.</div>
    </div>
    <div class="flex-gap" style="flex-wrap:wrap; align-items:center;">
      ${DB.proyectos.length ? selectorProyectos() : ''}
      <div class="ctx-switch">
        ${DB.proyectos.length ? `<div class="ctx-chip ${contextoChatReq==='proyecto'?'active':''}" onclick="contextoChatReq='proyecto'; renderAll();">Este proyecto</div>` : ''}
        <div class="ctx-chip ${contextoChatReq==='general'?'active':''}" onclick="contextoChatReq='general'; renderAll();">💬 General</div>
      </div>
      <div class="alert-chip ${criticasAbiertas===0?'zero':''}" onclick="filtroReq='criticas'; panelReqAbierto=true; renderAll();" title="Requerimientos críticos abiertos, en todos los proyectos">
        ${criticasAbiertas===0 ? '✓ Sin críticos abiertos' : `🔴 ${criticasAbiertas} crítico(s) abierto(s)`}
      </div>
    </div>
  </div>

  <div class="req-body">
    <div class="chat-col">
      ${renderChatHeadReq()}
      <div class="messages" id="reqMessagesBox">${renderMensajesReq()}</div>
      <div class="composer">
        <textarea id="reqComposerInput" placeholder="Escribe un mensaje…" rows="1" onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault(); enviarMensajeReq();}"></textarea>
        <button class="send-btn" onclick="enviarMensajeReq()" title="Enviar">➤</button>
      </div>
    </div>
    ${panelReqAbierto ? renderPanelRequerimientos() : ''}
  </div>
  `;
}

function renderChatHeadReq() {
  const nombreSala = contextoChatReq==='general' ? 'General (temas transversales)' : (proy()?.nombre || '—');
  const key = claveSalaActivaReq();
  const reqAbiertosSala = Object.values(DB.mensajes[key]||{}).filter(m=>m.req && m.req.estado!=='resuelta').length;
  return `
  <div class="chat-head">
    <div>
      <div style="font-weight:700; color:var(--ink); font-size:13.5px;">${contextoChatReq==='general'?'💬':'⚡'} ${nombreSala}</div>
      <div class="room-sub"><span class="online-dot"></span> ${listaConectados.length} conectado(s) ahora</div>
    </div>
    <button class="btn btn-sm req-toggle-btn" onclick="panelReqAbierto=!panelReqAbierto; renderAll();">
      📌 Requerimientos
      ${reqAbiertosSala ? `<span class="req-toggle-badge">${reqAbiertosSala}</span>` : ''}
    </button>
  </div>`;
}

function renderMensajesReq() {
  const key = claveSalaActivaReq();
  const dict = DB.mensajes[key] || {};
  const msgs = Object.entries(dict).map(([id,m]) => ({...m, id})).sort((a,b) => (a.ts||0)-(b.ts||0));
  if (!msgs.length) return `<div style="margin:auto; color:var(--muted); font-size:13px;">Aún no hay mensajes en esta sala.</div>`;
  const proyDe = proy();
  return msgs.map(m => {
    const esPropio = m.autor === DB.usuario;
    const colorBorde = m.req ? (URGENCIA_REQ_INFO[m.req.urgencia].clase==='b-rojo'?'var(--danger)':URGENCIA_REQ_INFO[m.req.urgencia].clase==='b-amarillo'?'var(--copper)':'var(--muted)') : '';
    const punch = (m.req && m.req.punchId && proyDe) ? proyDe.punch.find(x=>x.id===m.req.punchId) : null;
    const hora = m.ts ? new Date(m.ts).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}) : '';
    return `
    <div class="msg-row ${esPropio?'own':''}">
      <div class="avatar">${inicialesNombre(m.autor)}</div>
      <div class="msg-body">
        <div class="msg-meta">${!esPropio?`<b>${(m.autor||'').split(' ')[0]}</b> · `:''}<span class="msg-time">${hora}</span></div>
        <div class="bubble ${m.req?'req':''}" ${m.req?`style="border-left-color:${colorBorde}"`:''}>
          ${m.req ? `<div class="req-head">
            <span class="badge b-blue"><span class="dot"></span>📌 ${m.req.tipo}</span>
            <span class="badge ${URGENCIA_REQ_INFO[m.req.urgencia].clase}"><span class="dot"></span>${URGENCIA_REQ_INFO[m.req.urgencia].label}</span>
            ${punch?`<span class="link-chip">${punch.id}</span>`:''}
          </div>` : ''}
          ${escaparHtml(m.texto)}
          ${m.req ? `<div class="req-foot">
            <span class="badge ${ESTADO_REQ_INFO[m.req.estado].clase}"><span class="dot"></span>${ESTADO_REQ_INFO[m.req.estado].label}</span>
            <span>→ ${m.req.asignadoA}</span>
          </div>` : ''}
        </div>
      </div>
      ${!m.req ? `<button class="pin-action" title="Marcar como requerimiento" onclick="abrirModalRequerimiento('${m.id}')">📌</button>` : ''}
    </div>`;
  }).join('');
}

function renderPanelRequerimientos() {
  const todos = [];
  Object.entries(DB.mensajes||{}).forEach(([salaId, dict]) => {
    Object.entries(dict||{}).forEach(([id,m]) => { if (m.req) todos.push({...m, id, salaId}); });
  });
  let lista = todos;
  if (filtroReq==='abiertas') lista = todos.filter(m=>m.req.estado==='abierta');
  if (filtroReq==='proceso') lista = todos.filter(m=>m.req.estado==='en_proceso');
  if (filtroReq==='resueltas') lista = todos.filter(m=>m.req.estado==='resuelta');
  if (filtroReq==='criticas') lista = todos.filter(m=>m.req.urgencia==='critica' && m.req.estado!=='resuelta');
  const orden = {critica:0, alta:1, media:2, baja:3};
  lista = [...lista].sort((a,b) => orden[a.req.urgencia]-orden[b.req.urgencia]);

  return `
  <div class="req-panel mobile-open">
    <div class="req-panel-head">
      <h3 style="margin:0; font-size:14.5px;">Requerimientos</h3>
      <button class="close-x" onclick="panelReqAbierto=false; renderAll();">✕</button>
    </div>
    <div class="req-filters">
      ${[['todas','Todas'],['criticas','Críticas'],['abiertas','Abiertas'],['proceso','En proceso'],['resueltas','Resueltas']].map(([k,l]) =>
        `<button class="btn btn-sm ${filtroReq===k?'btn-primary':''}" onclick="filtroReq='${k}'; renderAll();">${l}</button>`
      ).join('')}
    </div>
    <div class="req-list">
      ${lista.length ? lista.map(m => {
        const proyDe = DB.proyectos.find(p=>p.id===m.salaId);
        const punch = (m.req.punchId && proyDe) ? proyDe.punch.find(x=>x.id===m.req.punchId) : null;
        const siguiente = ESTADO_REQ_SIGUIENTE[m.req.estado];
        return `
        <div class="req-card">
          <div class="row">
            <span class="badge b-blue"><span class="dot"></span>${m.req.tipo}</span>
            <span class="badge ${URGENCIA_REQ_INFO[m.req.urgencia].clase}"><span class="dot"></span>${URGENCIA_REQ_INFO[m.req.urgencia].label}</span>
          </div>
          <div class="txt" onclick="${m.salaId!=='general'?`DB.proyectoActivo='${m.salaId}';`:''} contextoChatReq='${m.salaId==='general'?'general':'proyecto'}'; panelReqAbierto=false; renderAll();">${escaparHtml(m.texto)}</div>
          ${punch?`<div class="link-chip" style="margin-bottom:6px;">🔗 ${punch.id} · ${punch.desc}</div>`:''}
          <div class="row">
            <span class="badge ${ESTADO_REQ_INFO[m.req.estado].clase}"><span class="dot"></span>${ESTADO_REQ_INFO[m.req.estado].label}</span>
            <span class="mono" style="font-size:10.5px; color:var(--muted);">${m.salaId==='general'?'General':(proyDe?proyDe.codigo:m.salaId)}</span>
          </div>
          <div class="who">👤 ${m.autor} → <b>${m.req.asignadoA}</b></div>
          <div class="actions">
            ${siguiente ? `<button class="btn btn-sm" onclick="cambiarEstadoRequerimiento('${m.salaId}','${m.id}')">Marcar ${ESTADO_REQ_INFO[siguiente].label} →</button>` : ''}
            <button class="btn btn-sm btn-whatsapp" onclick="avisarWhatsappRequerimiento('${m.salaId}','${m.id}')">📲 Avisar por WhatsApp</button>
          </div>
        </div>`;
      }).join('') : `<div style="text-align:center; padding:26px 10px; color:var(--muted); font-size:12.5px;">No hay requerimientos en este filtro.</div>`}
    </div>
  </div>`;
}

function enviarMensajeReq() {
  const input = document.getElementById("reqComposerInput");
  const texto = (input.value||"").trim();
  if (!texto) return;
  mensajesRef.child(claveSalaActivaReq()).push({ autor: DB.usuario, rol: DB.role, texto, ts: Date.now(), req: null });
  input.value = "";
}

function cambiarEstadoRequerimiento(salaId, msgId) {
  const msg = (DB.mensajes[salaId]||{})[msgId];
  if (!msg || !msg.req) return;
  const siguiente = ESTADO_REQ_SIGUIENTE[msg.req.estado];
  if (!siguiente) return;
  mensajesRef.child(salaId).child(msgId).child('req').update({estado: siguiente});
  registrarHistorial({proyecto: salaId==='general'?'General':(DB.proyectos.find(p=>p.id===salaId)?.codigo||salaId), accion:"Modificar", detalle:`Requerimiento "${msg.req.tipo}" → ${ESTADO_REQ_INFO[siguiente].label}`, usuario:DB.usuario+" · "+DB.role, criticidad:"Baja"});
  guardarEstado("Estado de requerimiento actualizado");
  toast(`Requerimiento → ${ESTADO_REQ_INFO[siguiente].label}.`, "ok");
}

function avisarWhatsappRequerimiento(salaId, msgId) {
  const msg = (DB.mensajes[salaId]||{})[msgId];
  if (!msg || !msg.req) return;
  const persona = DB.personal.find(p => p.nombre===msg.req.asignadoA);
  const proyectoNombre = salaId==='general' ? 'General' : (DB.proyectos.find(p=>p.id===salaId)?.nombre || salaId);
  const texto = `⚠️ Requerimiento ${URGENCIA_REQ_INFO[msg.req.urgencia].label.toUpperCase()} — ${proyectoNombre}\n"${msg.texto}"\nAsignado a ti por ${msg.autor}. Revísalo en Alutipo PMO → Requerimientos.`;
  abrirWhatsApp(persona?persona.telefono:'', texto);
}

/* ===== Modal de 3 pasos: marcar un mensaje como requerimiento ===== */
let modalReqMsgId = null;
let modalReqPaso = 1;
let modalReqTipo = null;
let modalReqPunchId = "";
let modalReqBloquea = null;
let modalReqResuelveOtro = null;
let modalReqAsignado = "";

function abrirModalRequerimiento(msgId) {
  modalReqMsgId = msgId; modalReqPaso = 1; modalReqTipo = null; modalReqPunchId = "";
  modalReqBloquea = null; modalReqResuelveOtro = null; modalReqAsignado = "";
  openModal(cuerpoModalRequerimiento(), 460);
}
function seleccionarTipoReq(t) {
  modalReqTipo = t;
  modalReqAsignado = sugerenciaAsignadoReq(t);
  openModal(cuerpoModalRequerimiento(), 460);
}
function pasoValidoReq() {
  if (modalReqPaso===1) return !!modalReqTipo;
  if (modalReqPaso===2) return modalReqBloquea!==null;
  if (modalReqPaso===3) return modalReqResuelveOtro!==null && !!modalReqAsignado;
  return false;
}
function cuerpoModalRequerimiento() {
  const key = claveSalaActivaReq();
  const msg = (DB.mensajes[key]||{})[modalReqMsgId];
  if (!msg) return `<div class="modal-head"><h3>Requerimiento</h3><button class="close-x" onclick="closeModal()">✕</button></div><div class="modal-body">Este mensaje ya no está disponible.</div><div class="modal-foot"><button class="btn" onclick="closeModal()">Cerrar</button></div>`;

  const restringido = ROLES_REQ_RESTRINGIDO.includes(DB.role);
  const opciones = opcionesAsignacionReq();
  const itemsProyecto = (contextoChatReq==='proyecto' && proy()) ? proy().punch : [];
  const urgenciaCalc = (modalReqBloquea!==null && modalReqResuelveOtro!==null) ? calcularUrgenciaReq(modalReqBloquea, modalReqResuelveOtro) : null;

  return `
  <div class="modal-head">
    <h3>📌 Marcar como requerimiento</h3>
    <div style="display:flex; align-items:center; gap:12px;">
      <div class="step-dots">${[1,2,3].map(n=>`<span class="${n===modalReqPaso?'active':''}"></span>`).join('')}</div>
      <button class="close-x" onclick="closeModal()">✕</button>
    </div>
  </div>
  <div class="modal-body">
    <div class="hint" style="margin-bottom:12px; background:var(--paper-2); padding:8px 10px; border-radius:7px;">"${escaparHtml(msg.texto)}"</div>
    ${modalReqPaso===1 ? `
      <div class="field-label">Paso 1 de 3 — ¿Qué tipo de requerimiento es?</div>
      <div class="tipo-grid">
        ${["Duda técnica","Falta material","Trabajo adicional","Autorización","Otro"].map(t=>`
          <div class="tipo-chip ${modalReqTipo===t?'selected':''}" onclick="seleccionarTipoReq('${t}')">${t}</div>
        `).join('')}
      </div>
      ${itemsProyecto.length ? `
        <div class="field-label">¿A qué ítem del Punch List corresponde? (opcional)</div>
        <select onchange="modalReqPunchId=this.value;">
          <option value="">— No corresponde a un ítem específico —</option>
          ${itemsProyecto.map(it=>`<option value="${it.id}" ${modalReqPunchId===it.id?'selected':''}>${it.id} · ${it.desc}</option>`).join('')}
        </select>
        <div class="hint">Al vincularlo, quedará visible desde esa tarea en el Punch List, no solo aquí.</div>
      ` : ''}
    ` : ''}
    ${modalReqPaso===2 ? `
      <div class="field-label">Paso 2 de 3 — Impacto en tu trabajo</div>
      <div class="hint" style="margin-bottom:2px;">¿Esto te impide seguir trabajando ahora mismo, o puedes avanzar en otra parte de la tarea mientras se resuelve?</div>
      <button class="opt-btn ${modalReqBloquea===true?'selected':''}" onclick="modalReqBloquea=true; openModal(cuerpoModalRequerimiento(),460);">Me detiene por completo<small>No puedo seguir avanzando hasta que esto se resuelva</small></button>
      <button class="opt-btn ${modalReqBloquea===false?'selected':''}" onclick="modalReqBloquea=false; openModal(cuerpoModalRequerimiento(),460);">Puedo seguir en paralelo<small>Sigo avanzando en otra parte mientras se resuelve</small></button>
    ` : ''}
    ${modalReqPaso===3 ? `
      <div class="field-label">Paso 3 de 3 — Capacidad de resolución</div>
      <div class="hint" style="margin-bottom:2px;">¿Puedes resolverlo tú mismo con lo que tienes disponible, o requiere que otra persona lo resuelva o autorice?</div>
      <button class="opt-btn ${modalReqResuelveOtro===false?'selected':''}" onclick="modalReqResuelveOtro=false; openModal(cuerpoModalRequerimiento(),460);">Lo resuelvo yo mismo<small>Tengo lo necesario para seguir sin depender de otra persona</small></button>
      <button class="opt-btn ${modalReqResuelveOtro===true?'selected':''}" onclick="modalReqResuelveOtro=true; openModal(cuerpoModalRequerimiento(),460);">Requiere a otra persona<small>Necesito que alguien más lo resuelva, decida o autorice</small></button>
      ${urgenciaCalc ? `
      <div class="urgencia-preview ${URGENCIA_REQ_INFO[urgenciaCalc].clase}">
        <span class="badge ${URGENCIA_REQ_INFO[urgenciaCalc].clase}"><span class="dot"></span>${URGENCIA_REQ_INFO[urgenciaCalc].label}</span>
        <span style="font-size:12px;">Urgencia calculada — no se elige a mano.</span>
      </div>` : ''}
      <div class="field-label">¿A quién se asigna?</div>
      ${restringido ? `<div class="hint">Como ${DB.role}, puedes asignarlo solo a una jefatura que pueda destrabarlo.</div>` : `<div class="hint">Como ${DB.role}, puedes asignarlo a cualquier persona de la dotación.</div>`}
      <select onchange="modalReqAsignado=this.value; openModal(cuerpoModalRequerimiento(),460);">
        <option value="">Selecciona…</option>
        ${opciones.map(u=>`<option value="${u.nombre}" ${modalReqAsignado===u.nombre?'selected':''}>${u.nombre} — ${u.rol}</option>`).join('')}
      </select>
      ${modalReqAsignado ? `<div class="suggest-note">💡 Sugerido según el tipo "${modalReqTipo}" — puedes cambiarlo.</div>` : ''}
    ` : ''}
  </div>
  <div class="modal-foot">
    <button class="btn" onclick="${modalReqPaso===1?'closeModal()':'modalReqPaso--; openModal(cuerpoModalRequerimiento(),460);'}">${modalReqPaso===1?'Cancelar':'← Atrás'}</button>
    <button class="btn btn-primary" ${pasoValidoReq()?'':'disabled'} onclick="${modalReqPaso===3?'confirmarRequerimiento()':'modalReqPaso++; openModal(cuerpoModalRequerimiento(),460);'}">${modalReqPaso===3?'Marcar requerimiento':'Siguiente →'}</button>
  </div>
  `;
}
function confirmarRequerimiento() {
  const urgencia = calcularUrgenciaReq(modalReqBloquea, modalReqResuelveOtro);
  const key = claveSalaActivaReq();
  const msg = (DB.mensajes[key]||{})[modalReqMsgId];
  mensajesRef.child(key).child(modalReqMsgId).update({
    req: { tipo:modalReqTipo, punchId:modalReqPunchId||null, bloquea:modalReqBloquea, resuelveOtro:modalReqResuelveOtro, urgencia, estado:"abierta", asignadoA:modalReqAsignado }
  });
  registrarHistorial({proyecto: key==='general'?'General':(proy()?.codigo||''), accion:"Crear", detalle:`Requerimiento (${URGENCIA_REQ_INFO[urgencia].label}): "${(msg?.texto||'').slice(0,60)}" → ${modalReqAsignado}`, usuario:DB.usuario+" · "+DB.role, criticidad: urgencia==='critica'?'Alta':'Media'});
  guardarEstado("Requerimiento marcado");
  closeModal();
  panelReqAbierto = true;
  toast("Requerimiento marcado y visible para todos.", "ok");
}

/* ---- Solicitar OC: genera el correo y lo copia al portapapeles ---- */
function copiarAlPortapapeles(texto) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(texto).then(()=>true).catch(()=>copiarFallback(texto));
  }
  return Promise.resolve(copiarFallback(texto));
}
function copiarFallback(texto) {
  try {
    const ta = document.createElement('textarea');
    ta.value = texto; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch(e) { return false; }
}
/* Abre un borrador nuevo en el cliente de correo predeterminado (Outlook si
   está configurado como tal) con Para/Asunto/Cuerpo ya cargados. No requiere
   que el usuario copie ni pegue nada. Limitación real: los enlaces mailto:
   tienen un límite de longitud dependiente del navegador/SO — para correos
   muy largos con muchos ítems puede que el cuerpo llegue recortado; en ese
   caso, usar el botón "Copiar correo" como respaldo. */
function abrirEnOutlook(destinatario, asunto, cuerpo) {
  const url = `mailto:${destinatario||''}?subject=${encodeURIComponent(asunto||'')}&body=${encodeURIComponent(cuerpo||'')}`;
  window.open(url, '_blank');
}

/* Abre WhatsApp (celular o WhatsApp Web, según el dispositivo) con el
   mensaje ya escrito hacia un número específico — la persona que asigna
   la tarea solo tiene que apretar "Enviar". No es automático: requiere
   este clic. Para notificaciones realmente automáticas hace falta la
   API oficial de WhatsApp Business + un backend propio. */
function abrirWhatsApp(telefono, mensaje) {
  const limpio = (telefono||"").replace(/[^\d+]/g, "");
  if (!limpio) { toast("Esta persona no tiene teléfono registrado en la dotación.", "danger"); return; }
  const url = `https://wa.me/${limpio.replace(/^\+/,'')}?text=${encodeURIComponent(mensaje||'')}`;
  window.open(url, '_blank');
}

function crearProyecto(datos) {
  if (DB.role !== "Jefe de Proyecto" && DB.role !== "Gerencia") {
    toast(`Tu rol (${DB.role}) no puede crear proyectos.`, "danger");
    return;
  }
  const id = "P-"+Math.random().toString(36).slice(2,8).toUpperCase();
  const modoCierre = !!datos.modoCierre;

  // "Modo cierre": el proyecto ya viene avanzado en terreno y lo que
  // importa es el Punch List, no reconstruir el historial completo de
  // las 19 postas. Se marcan 1-17 como completadas administrativamente
  // (NO por seguimiento real posta a posta) para abrir Punch List de
  // inmediato, y queda registrado explícitamente en el historial que
  // fue un cierre administrativo, para no confundirlo con avance real.
  let postas = genPostas();
  if (modoCierre) {
    postas.forEach(t => {
      if (t.numero <= 17) { t.estado = "Completado"; t.avance = 100; t.fechaCompletado = hoyISO(); }
      else if (t.numero === 18) { t.estado = "En Progreso"; t.avance = 50; t.fechaInicio = hoyISO(); }
    });
  }

  const nuevo = {
    id, codigo: datos.codigo || "SIN-CODIGO", nombre: datos.nombre || "Proyecto sin nombre",
    cliente: datos.cliente || "—", pm: datos.pm || DB.usuario, tipo: datos.tipo || "Nuevo",
    prioridad: datos.prioridad || "Media", criticidad: datos.criticidad || "Media",
    fechaKickoff: datos.fechaKickoff || hoyISO(), estadoProyecto: "En Definición",
    presupuestoTotal: Number(datos.presupuesto) || 0,
    modoCierre,
    postas, compras:[], cotizaciones:[], bodega:[], punch:[], reaperturas:[], iaRiesgos:[], reportesGerenciales:[], planificacion:[],
  };
  DB.proyectos.push(nuevo);
  DB.proyectoActivo = id;
  registrarHistorial({proyecto: nuevo.codigo, accion:"Crear", detalle:`Nuevo proyecto: ${nuevo.nombre}${modoCierre?' — creado en modo cierre: postas 1-17 marcadas completadas ADMINISTRATIVAMENTE (sin seguimiento posta a posta), foco en Punch List':''}`, usuario:DB.usuario, criticidad:"Media"});
  guardarEstado();
  toast(modoCierre ? "Proyecto creado en modo cierre — Punch List ya está disponible." : "Proyecto creado y guardado en la nube.", "ok");
  return { id, modoCierre };
}

function agregarTareaGantt(pid, datos) {
  const p = proy(pid);
  if (!puedeEditarPlanificacion()) return false;
  if (!datos.nombre || !datos.inicio || !datos.fin) {
    toast("Nombre, inicio y fin son obligatorios.", "danger");
    return false;
  }
  const nextId = (p.planificacion.reduce((m,t) => Math.max(m,t.id), 0)) + 1;
  p.planificacion.push({
    id: nextId, nombre: datos.nombre, fase: datos.fase || "General", responsable: datos.responsable || "",
    inicio: datos.inicio, fin: datos.fin, avance: Number(datos.avance) || 0,
    hito: !!datos.hito, predecesores: parsePredecesoresTexto(datos.predecesores),
  });
  registrarHistorial({proyecto:p.codigo, accion:"Crear", detalle:`Nueva tarea de planificación: ${datos.nombre}`, usuario:DB.usuario+" · "+DB.role, criticidad:"Baja"});
  guardarEstado();
  return true;
}

function editarTareaGantt(pid, id, datos) {
  const p = proy(pid);
  if (!puedeEditarPlanificacion()) return false;
  const t = p.planificacion.find(x => x.id === id);
  if (!t) return false;
  Object.assign(t, {
    nombre: datos.nombre, fase: datos.fase, responsable: datos.responsable,
    inicio: datos.inicio, fin: datos.fin, avance: Number(datos.avance) || 0,
    hito: !!datos.hito, predecesores: parsePredecesoresTexto(datos.predecesores),
  });
  registrarHistorial({proyecto:p.codigo, accion:"Modificar", detalle:`Tarea de planificación editada: ${t.nombre}`, usuario:DB.usuario+" · "+DB.role, criticidad:"Baja"});
  guardarEstado();
  return true;
}

function eliminarTareaGantt(pid, id) {
  const p = proy(pid);
  if (!puedeEditarPlanificacion()) return;
  const t = p.planificacion.find(x => x.id === id);
  p.planificacion = p.planificacion.filter(x => x.id !== id);
  p.planificacion.forEach(x => { x.predecesores = (x.predecesores||[]).filter(pr => pr.ref !== id); });
  registrarHistorial({proyecto:p.codigo, accion:"Eliminar", detalle:`Tarea de planificación eliminada: ${t?.nombre || id}`, usuario:DB.usuario+" · "+DB.role, criticidad:"Media"});
  guardarEstado();
  toast("Tarea eliminada.", "ok");
}

function parsePegadoGantt(texto) {
  const lineas = texto.split("\n").map(l => l.trim()).filter(Boolean);
  const filas = [];
  lineas.forEach(linea => {
    const cols = linea.split("\t").map(c => c.trim());
    if (cols.length < 3) return;
    const [nombre, fase, responsable, inicio, fin, avance, predecesores] = cols;
    if (!nombre || /^tarea$/i.test(nombre)) return;
    filas.push({
      nombre, fase: fase || "General", responsable: responsable || "",
      inicio: normalizaFecha(inicio), fin: normalizaFecha(fin || inicio),
      avance: Number((avance||"0").replace('%','').replace(',','.')) || 0,
      predecesores: predecesores || "",
    });
  });
  return filas;
}

function normalizaFecha(s) {
  if (!s) return "";
  s = s.trim();
  const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if (m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return s;
}

function importarPegadoGantt(pid, texto) {
  const p = proy(pid);
  if (!puedeEditarPlanificacion()) return false;
  const filas = parsePegadoGantt(texto);
  if (!filas.length) {
    toast("No se reconoció ninguna fila válida.", "danger");
    return false;
  }
  let nextId = (p.planificacion.reduce((m,t) => Math.max(m,t.id), 0)) + 1;
  const idPorNombre = {};
  p.planificacion.forEach(t => idPorNombre[t.nombre.toLowerCase()] = t.id);
  const nuevas = [];
  filas.forEach(f => {
    const id = nextId++;
    idPorNombre[f.nombre.toLowerCase()] = id;
    nuevas.push({ id, nombre:f.nombre, fase:f.fase, responsable:f.responsable, inicio:f.inicio, fin:f.fin, avance:f.avance, hito: f.inicio===f.fin, predecesoresTexto:f.predecesores });
  });
  nuevas.forEach((n, idx) => {
    const preds = parsePredecesoresTexto(n.predecesoresTexto);
    n.predecesores = preds.map(pr => {
      const filaRef = nuevas[pr.ref-1];
      return { ref: filaRef ? filaRef.id : pr.ref, lagDias: pr.lagDias };
    }).filter(pr => p.planificacion.some(t => t.id === pr.ref) || nuevas.some(t => t.id === pr.ref));
    delete n.predecesoresTexto;
  });
  p.planificacion.push(...nuevas);
  registrarHistorial({proyecto:p.codigo, accion:"Crear", detalle:`Importadas ${nuevas.length} tarea(s) de planificación`, usuario:DB.usuario+" · "+DB.role, criticidad:"Media"});
  guardarEstado();
  toast(`${nuevas.length} tarea(s) importada(s).`, "ok");
  return true;
}

let currentPage = "dashboard";

function shell() {
  const app = document.getElementById("app");
  app.innerHTML = `
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo-plate">
          <img src="${LOGO_ALUTIPO_B64}" alt="Alutipo" class="brand-logo-img">
        </div>
        <div class="brand-sub" style="margin-top:8px;">PMO · Coordinación de Proyectos</div>
      </div>
      <nav class="nav" id="navList"></nav>
      <div class="sidebar-foot">
        <b>${DB.usuario}</b><br>
        ${DB.role}
        ${esAdminUsuarios() ? `<div style="margin-top:8px; cursor:pointer; color:var(--copper-light)" onclick="modalGestionarUsuarios()">👥 Gestionar usuarios →</div>` : ''}
        <div style="margin-top:8px; cursor:pointer; color:var(--copper-light)" onclick="cerrarSesion()">Cerrar sesión →</div>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="cerrarSidebarMobile()"></div>
    <div class="main">
      <div class="topbar">
        <div class="topbar-left">
          <button class="hamburger-btn" onclick="toggleSidebarMobile()" aria-label="Abrir menú">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div>
            <div class="topbar-title" id="topbarTitle">Dashboard</div>
            <div class="topbar-crumb" id="topbarCrumb">ALUTIPO-PMO / dashboard</div>
          </div>
        </div>
        <div class="topbar-right" style="position:relative;">
          <div id="conectadosBadge"></div>
          <div id="panelConectados"></div>
          <div id="syncIndicator"></div>
          <button class="btn btn-sm" onclick="sincronizarDesdeServidor(false); toast('Buscando cambios de otros colaboradores…','ok');" title="Sincronizar ahora">⟳ Actualizar</button>
          <div class="tag-role" style="padding:6px 10px;">${DB.usuario} · ${DB.role}</div>
        </div>
      </div>
      <div class="content" id="content"></div>
    </div>
  `;
  const navList = document.getElementById("navList");
  navList.innerHTML = NAV.map(g => {
    const items = g.items.filter(navItemVisible);
    if (!items.length) return '';
    return `
    <div class="nav-group-label">${g.group}</div>
    ${items.map(it => `<button class="nav-item ${it.id===currentPage ? 'active' : ''}" data-nav="${it.id}" onclick="goTo('${it.id}')">${it.icon}<span>${it.label}</span>${it.id==='requerimientos' && requerimientosAbiertosGlobal() ? `<span class="req-nav-badge" style="display:flex;">${requerimientosAbiertosGlobal()}</span>` : ''}</button>`).join('')}
  `;
  }).join('');
  document.getElementById("content").innerHTML = NAV.flatMap(g => g.items).filter(navItemVisible).map(it => `<div class="page ${it.id===currentPage ? 'active' : ''}" id="page-${it.id}"></div>`).join('');
  actualizarIndicadorSync();
  renderBadgeConectados();
  renderPanelConectados();
}

function toggleSidebarMobile() {
  document.querySelector('.sidebar')?.classList.toggle('sidebar-open');
  document.getElementById('sidebarOverlay')?.classList.toggle('show');
}
function cerrarSidebarMobile() {
  document.querySelector('.sidebar')?.classList.remove('sidebar-open');
  document.getElementById('sidebarOverlay')?.classList.remove('show');
}

function goTo(id) {
  const item = NAV.flatMap(g => g.items).find(i => i.id === id);
  if (item && !navItemVisible(item)) return; // el rol actual no tiene acceso a esta página
  currentPage = id;
  cerrarSidebarMobile();
  renderAll();
  actualizarMiPresencia();
  window.scrollTo({top: 0, behavior: "smooth"});
}

function renderAll() {
  const paginaActual = NAV.flatMap(g => g.items).find(i => i.id === currentPage);
  if (paginaActual && !navItemVisible(paginaActual)) currentPage = "dashboard"; // el rol cambió o no correspondía
  shell();
  document.getElementById("topbarTitle").textContent = NAV.flatMap(g => g.items).find(i => i.id === currentPage)?.label || "";
  document.getElementById("topbarCrumb").textContent = "ALUTIPO-PMO / "+currentPage;
  const renderers = {
    dashboard: renderDashboard, miPanel: renderMiPanel, panelEquipo: renderPanelEquipo, bodegaGeneral: renderBodegaGeneral, personal: renderPersonal, proyecto360: renderProyecto360, planificacion: renderPlanificacion, compras: renderCompras,
    presupuesto: renderPresupuesto, bodega: renderBodega, punch: renderPunch, requerimientos: renderRequerimientos,
    reaperturas: renderReaperturas, copiloto: renderCopiloto, auditoria: renderAuditoria,
  };
  const target = document.getElementById("page-"+currentPage);
  if (target && renderers[currentPage]) target.innerHTML = renderers[currentPage]();
  if (currentPage === "requerimientos") {
    const box = document.getElementById("reqMessagesBox");
    if (box) box.scrollTop = box.scrollHeight;
  }
}

function shellCargando() {
  document.getElementById("app").innerHTML = `
    <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; background:var(--paper);">
      <img src="${LOGO_ALUTIPO_B64}" alt="Alutipo" style="height:34px;">
      <div class="muted small">Cargando tablero compartido de ALUTIPO PMO con Firebase…</div>
    </div>`;
}

// ================================================================
// 9. ARRANQUE — gate de autenticación real antes de mostrar cualquier dato
// ================================================================
let sesionYaIniciada = false;

document.addEventListener("DOMContentLoaded", async () => {
  shellCargando();
  await cargarUsuariosAutorizados();

  auth.onAuthStateChanged(async (user) => {
    usuarioAuth = user;
    if (!user) {
      if (miPresenciaRef) { try { await miPresenciaRef.remove(); } catch(e){} miPresenciaRef = null; }
      sesionYaIniciada = false;
      mostrarLogin();
      return;
    }
    const autorizado = DB.usuariosAutorizados[sanitizarEmailKey(user.email)];
    if (!autorizado) {
      // la cuenta existe pero ya no está en la lista autorizada (removida por un admin)
      mostrarLogin("Tu acceso fue removido por un administrador. Contacta a tu Jefe de Proyecto.");
      await auth.signOut();
      return;
    }
    DB.usuario = autorizado.nombre;
    DB.role = autorizado.rol;
    if (!sesionYaIniciada) {
      sesionYaIniciada = true;
      // Un Técnico de Terreno entra directo a su panel de trabajo en vez
      // del dashboard ejecutivo — es la pantalla que necesita a diario.
      if (currentPage === "dashboard" && DB.role === "Técnico de Terreno") currentPage = "miPanel";
      shellCargando();
      await cargarEstadoInicial();
    }
  });
});
</script>
